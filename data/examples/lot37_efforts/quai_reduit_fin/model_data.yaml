# Quai réduit à maillage raffiné ×2 (lot 37, critère C10) : copie de
# data/examples/lot30_quai_reduit/model_data_reduit.yaml dont seule la taille
# verticale visée est changée (0,25 m -> 0,125 m) : étude de convergence des
# efforts d'ensemble des tubes. Aucune donnée de projet n'est modifiée.
# Données chiffrées du « quai réduit » (lot 30, étape 2) : copie de
# data/examples/combiwall_model_data.yaml (lot 25, QUAI-CW-TEST-01) dont
# seuls les six champs de tranche (geometrie.*, repere.x_face_coupe_*) sont
# changés, de huit entraxes à deux, pour isoler par la chaîne de production
# elle-même (même script Salomé, même générateur, mêmes décisions) le pivot
# nul du lot 28 (`<F> <FACTOR_11>`, docs/essais_lot28.md, étape 4).
#
# Ce n'est PAS une nouvelle donnée de projet : aucune décision n'est prise ou
# complétée ici (CLAUDE.md, « interdits » du lot 30). Les deux commentaires
# qui citaient TUBE_05 (tube central du modèle complet) sont mis à jour vers
# TUBE_02 (tube central du modèle réduit, calculé par
# aster_expert.meshing.combiwall.build_params : central = (n_tubes+1)//2 = 2
# pour n_tubes = 3) ; les valeurs elles-mêmes ne changent pas, les charges
# ponctuelles restant portées par le tube central quel qu'il soit.
#
# Schéma, sources et conventions : voir l'en-tête de combiwall_model_data.yaml.
