# décision ou d'un constat de la fiche) et un commentaire facultatif. Les
# valeurs sont recopiées, dans l'unité de leur source (MN, kN, cm, mm, degrés) :
# aucune n'est convertie, calculée ni déduite ici. La conversion en unités du
