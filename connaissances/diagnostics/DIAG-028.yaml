id: DIAG-028
title: CARA_ELEM sous IMPR_RESU/RESU pour SIEF_ELGA de discrets sans sous-points (alarme MED2_13)
summary: IMPR_RESU au format MED de SIEF_ELGA sur des éléments DIS_T avec CARA_ELEM donne l'alarme
  MED2_13 (aucun élément à sous-points, CARA_ELEM ignoré) ; sous DEBUT(ERREUR=_F(ALARME='EXCEPTION'))
  elle devient une erreur fatale.
