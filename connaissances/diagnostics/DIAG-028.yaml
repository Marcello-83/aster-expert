cause: CARA_ELEM sous IMPR_RESU/RESU ne sert qu'aux champs à sous-points (DIAG-005) ; donné pour
  SIEF_ELGA d'éléments discrets, Code_Aster l'ignore avec l'alarme MED2_13, que le quai aggrave en
  erreur (DEBUT(ERREUR=_F(ALARME='EXCEPTION'))).
cause_established: true
correction: Ne pas donner CARA_ELEM à une occurrence de RESU dont le champ n'a pas de sous-points
  (forces des ressorts DIS_T) ; aster_expert.livrables.postcomm ne le donne plus pour la famille
  ressorts.
prevention: Le générateur des livrables n'écrit CARA_ELEM que hors de la famille ressorts.
