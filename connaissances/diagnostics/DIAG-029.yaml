id: DIAG-029
title: EFGE_NOEU de coques demandé après un EFGE_ELNO restreint aux poutres (alarme CALCULEL2_89)
summary: CALC_CHAMP(CONTRAINTE='EFGE_NOEU', GROUP_MA=<coques>) sur un résultat où EFGE_ELNO a déjà
  été calculé sur les seules poutres ne calcule pas EFGE_NOEU des coques (<A> CALCULEL2_89, « le
  champ XXXX_ELNO n'existe pas sur les éléments spécifiés ») ; calculé avant EFGE_ELNO des
  poutres, il l'est.
