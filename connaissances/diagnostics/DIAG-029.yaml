cause: Déduction, non établie par la documentation -- CALC_CHAMP ne recalcule pas EFGE_ELNO déjà
  présent dans le résultat (calculé sur les seules poutres) et ne trouve donc pas d'EFGE_ELNO sur
  les coques pour en déduire EFGE_NOEU ; l'ordre inverse (EFGE_NOEU des coques d'abord, ordre de
  l'estacade au lot 47) ne donne aucune alarme.
cause_established: false
correction: Calculer EFGE_NOEU des coques avant EFGE_ELNO restreint aux poutres (ou EFGE_ELNO sur
  les coques aussi) dans la production.
prevention: Un générateur de projet qui restreint EFGE_ELNO aux poutres calcule d'abord les champs
  des coques (pontons_alu_01.generation, estacade_pieux_01.generation).
