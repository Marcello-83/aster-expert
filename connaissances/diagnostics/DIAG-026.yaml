cause: 'Non établie : une seule occurrence sur deux exécutions identiques ; aucune erreur ni
  alarme dans les listings ; l''image lie OpenMPI 5.0.8 (MPI_THREAD_MULTIPLE) et une OpenBLAS
  monofil. La VM a été suspendue pendant l''exécution (uptime remis à zéro, horloge du conteneur
  décalée), ce qui peut aussi l''expliquer.'
cause_established: false
correction: 'Arrêter le conteneur (docker kill) et relancer ; le délai extérieur d''aster-expert run
  (time_limit × 1,25 × ncpus + 20 s) l''aurait arrêté de lui-même. Les mesures du lot 47 quater
  n''apportent aucun gain au parallélisme hybride sur ce cas (230 s contre 119 à 135 s en
  séquentiel) : la configuration par défaut reste un processus, un fil.'
prevention: Défaut des .export de projet ncpus 1 et mpi_nbcpu 1 (config/validation.yaml) ; un
  .export hybride se déclare avec un time_limit proportionné à la durée attendue.
