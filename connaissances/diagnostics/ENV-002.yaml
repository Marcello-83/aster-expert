id: ENV-002
title: Serveur MCP au schéma de la base plus ancien que la base
summary: Un processus de longue durée (le serveur MCP) relit la base à chaque appel mais garde le
  schéma importé à son démarrage ; une session qui ajoute un champ au schéma et à une entrée rend
  toute la base illisible pour ce processus, et search_connaissances échoue jusqu'au redémarrage.
origin_project: estacade_pieux_01
date: '2026-10-06'
validation_level: A
status: établi
sources:
