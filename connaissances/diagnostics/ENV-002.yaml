category: environnement
signature:
  kind: environnement
  identifiers: []
  pattern: 'KnowledgeBaseError.*Extra inputs are not permitted'
cause: 'Lot 47 bis : la session a ajouté `version` et `version_history` au modèle Control
  (aster_expert.connaissances.modeles) et à CTL-005, CTL-013. Le serveur MCP, lancé avant, validait
  les fichiers relus avec l''ancien modèle (extra="forbid") : deux entrées refusées, puis toutes
  celles qui les citent, et load_knowledge refuse la base entière. Un serveur neuf (mcp-check)
  importait le nouveau schéma et répondait.'
cause_established: true
correction: 'Depuis le lot 47 ter, search_connaissances et search_constats comparent l''empreinte des
  sources du chemin de lecture (aster_expert.connaissances.fraicheur) à celle du démarrage et
  rechargent ces modules si elle a changé. À défaut (schéma hors de ce chemin, comme
  aster_expert.agent.hypotheses) : redémarrer la session ou reconnecter le serveur (/mcp).'
prevention: Tout lot qui modifie un schéma de connaissances le dit dans son compte rendu ; la
  consigne « redémarrer la session avant le lot suivant » s'applique aussi à ce cas.
