  path: tests/unit/test_connaissances_fraicheur.py
  function: test_a_schema_changed_during_the_session_is_reloaded
  note: panne du lot 47 bis rejouée dans un sous-processus (copie des sources et de la base),
    puis corrigée par le rechargement
- kind: code
