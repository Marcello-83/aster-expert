id: DIAG-030
title: Pivot nul sur une rotation physique d'une poutre liée seulement en translation à ses
  deux extrémités (mécanisme de torsion)
summary: 'Un pivot nul FACTOR_11 sur un ddl physique de rotation (DRX) apparaît quand une
  poutre n''est reliée à ses deux appuis que par des rotules (translations seules) placées
  sous son axe : elle peut tourner autour de la droite qui joint ses deux appuis.' 
