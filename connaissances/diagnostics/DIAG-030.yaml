  pattern: Degré de liberté physique associé au noeud \d+ et à la composante DR[XYZ]
cause: Mécanisme de corps rigide de la poutre autour de la droite qui joint ses deux points
  d'appui, aucune liaison ne transmettant la rotation correspondante (rotules en
  translation seule aux deux bouts, rien d'autre ne tenant la poutre). Établi par le ddl
  désigné (rotation d'axe X du bout de longrine) et par la variante R, identique hors de ces
  liaisons, qui s'exécute.
cause_established: true
correction: Ne pas stabiliser artificiellement (ressort fictif, blocage) ; si la variante doit
  être calculée, décider avec l'ingénieur d'une liaison qui transmet la rotation (bout
  encastré, appui supplémentaire, liaison réelle de l'assemblage).
prevention: Avant d'exécuter, vérifier pour chaque barre liée seulement en translation à ses
  deux bouts qu'un autre élément tient sa rotation autour de la droite de ses appuis.
