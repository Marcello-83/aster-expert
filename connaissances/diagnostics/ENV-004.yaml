cause: 'run_aster_main (17.4.0), quand mpi_nbcpu > 1, relance run_aster sous mpiexec en ajoutant
  à la ligne de commande « --status-file <statfile> », où statfile est dans un répertoire
  temporaire ($HOME/.tmp_run_aster ou tmpdir) effacé à la fin ; ce second argument l''emporte
  sur celui de scripts/run_comm.py, qui ne trouvait plus de fichier de statut. Run_aster.status
  rendait alors un statut vide (diag « ? »).'
cause_established: true
correction: 'Depuis le lot 47 quater, scripts/run_comm.py calcule le statut par
  run_aster.status.get_status (fonction de run_aster) sur le fort.6 de chaque rang (proc.N) quand
  le fichier de statut manque, retient le premier rang dont le diagnostic diffère du rang 0, et
  écrit la façon dont le statut a été lu dans le compte rendu (status_source). Une exécution MPI
  rapportée unknown avant ce lot se relit dans ses listings proc.N/fort.6.'
prevention: Test tests/unit/test_run_comm_mpi.py (faux run_aster reproduisant le comportement
  observé) ; toute exécution MPI porte status_source dans son compte rendu.
