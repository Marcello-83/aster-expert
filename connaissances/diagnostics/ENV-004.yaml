id: ENV-004
title: Exécution MPI réussie rapportée « unknown » par aster-expert run (fichier de statut perdu)
summary: Avec mpi_nbcpu > 1, run_aster se relance sous mpiexec avec son propre --status-file,
  dans un répertoire qu'il efface ; le fichier de statut demandé par aster-expert run n'est
  jamais écrit et un calcul « DIAGNOSTIC JOB OK » sur tous les rangs était rapporté unknown.
