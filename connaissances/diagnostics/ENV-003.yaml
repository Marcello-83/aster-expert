  pattern: 'No space left on device|Errno 28'
cause: 'run_med_script (aster_expert.report.med_read) et mesh check copiaient le MED lu dans
  data/processed/mesh_checks/ (input.med, 1,9 Go pour l''estacade) et y laissaient l''extraction
  out.npz (1,9 Go), sans jamais les effacer : 20 Go pour les lectures du 5 octobre 2026 ; avec
  l''archive des exécutions (31 Go), le disque de 120 Go était plein le 6 octobre, pendant N1
  et N2 du lot 47 ter. Le compte rendu de chaque exécution, écrit après, est resté vide.'
cause_established: true
correction: 'Supprimer les copies input.med dont l''original de même SHA-256 est dans
  data/processed/runs/, et les out.npz (lot 47 ter, accord de MM) ; relancer l''exécution.
  Depuis le lot 47 ter, la copie est effacée dès la lecture faite (run_then_drop_copy) et
  take_arrays efface l''extraction une fois chargée ; rex lit un compte rendu vide comme un
  échec à classer, attribué par l''empreinte de son .comm.'
prevention: env-check vérifie l'espace libre (10 Go en profil vm, 2 Go en cloud et ci) avant
  tout lot ; aucune suppression de données sans accord de MM.
