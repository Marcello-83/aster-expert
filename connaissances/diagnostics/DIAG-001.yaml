cause: 'La matrice est singulière parce qu''un même degré de liberté est contraint deux fois
  : LIAISON_SOLIDE (anneau DKT + nœud de poutre, cas 3DA de R3.03.02) dualise les ddl de l''anneau,
  dont DRZ qui n''a qu''une raideur fictive (COEF_RIGI_DRZ, R3.07.03) ; DDL_IMPO de symétrie
  bloquait en plus DX, DRY, DRZ des mêmes nœuds d''anneau au plan de coupe (R3.03.01 : structure
  retenue par son dernier ddl physique). Ni les ressorts, ni les tirants, ni les palplanches,
  ni la raideur (1e2 à 1e10) n''en sont la cause (lots 29 et 30). FACTOR_11 a d''autres causes
  possibles (mécanisme libre) : ce diagnostic vaut pour une relation cinématique combinée
  à des blocages.'
cause_established: true
correction: 'Ne bloquer par DDL_IMPO que les ddl que la relation ne détermine pas : au plan
  de symétrie, DX/DRY/DRZ sur le groupe du plan privé des nœuds de l''anneau (DEFI_GROUP/DIFFE),
  l''anneau tenant ses ddl de LIAISON_SOLIDE (symmetry_and_support_block, contrôle check_symmetry_ddl_impo_no_ring_redundancy).'
prevention: Contrôle CTL-002 avant écriture du .comm.
