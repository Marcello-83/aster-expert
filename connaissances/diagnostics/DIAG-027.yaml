id: DIAG-027
title: PARALLELISME_TEMPS='OUI' sur REAC_NODA après MACRO_ELAS_MULT sous MPI (alarme PREPOST_15) donne des réactions fausses
summary: Avec 4 processus MPI et CALC_CHAMP(FORCE='REAC_NODA', PARALLELISME_TEMPS='OUI') sur un
  résultat de MACRO_ELAS_MULT dont le premier cas porte PESANTEUR, les réactions des cas 2 à 4 ont
  reçu une même force de +9 848,4 N (1 à 2 %) ; seul signe, l'alarme PREPOST_15.
