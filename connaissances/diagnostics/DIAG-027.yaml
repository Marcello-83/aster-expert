cause: 'Non établie. U4.81.04 (« Performance des calculs ») décrit le parallélisme en temps comme
  une distribution des pas sur les processus et PREPOST_15 annonce un repli sur le parallélisme en
  espace « comme si PARALLELISME_TEMPS était renseigné à NON » ; l''exécution montre pourtant des
  réactions fausses sur les cas 2 à 4 du premier lot, tous du même écart.'
cause_established: false
correction: Ne pas poser PARALLELISME_TEMPS='OUI' sur REAC_NODA (le gain mesuré est nul ou négatif,
  173 s contre 157 s sans) ; toute alarme PREPOST_15 rend les réactions suspectes jusqu'au
  contrôle d'équilibre (CTL-005).
prevention: Le contrôle d'équilibre par cas (Σ des réactions = charge appliquée, à 1e-6) détecte
  l'écart (1 à 2 %).
