category: préparation
cause: 'Le délai et la mémoire passés à run_aster viennent de la ligne de commande de aster-expert
  run (--timeout, --memory-mb) ou, à défaut, de config/validation.yaml (execution.timeout_seconds
  = 1800, memory_mb = 8192) ; P time_limit et P memory_limit de l''.export ne sont pas lus côté
  VM (leur lecture appartient à run_aster.export, dans le conteneur). La variante DST de
  l''estacade dure plus de 1 800 s.'
cause_established: true
correction: 'Avant le lot 47 quater : relancer avec --timeout et --memory-mb égaux aux valeurs de
  l''.export. Depuis le lot 47 quater, aster-expert run lit les quatre paramètres de ressource de
  l''.export (time_limit, memory_limit, ncpus, mpi_nbcpu ; aster_expert.execution.ressources) et
  les répercute sur run_aster et sur docker run (--cpus = ncpus × mpi_nbcpu, --memory =
  mpi_nbcpu × (memory_limit + addmem)) ; il n''y a plus de délai codé (timeout_seconds: auto, défaut
  de run_aster 86 400 s) ; la commande affiche les ressources résolues avant le départ.'
prevention: Les ressources résolues et leur origine (ligne de commande, .export, configuration,
  défaut) sont écrites dans compte_rendu.json (champ resources) ; un test vérifie que l'.export
  arrive sur la ligne docker run (tests/unit/test_execution_ressources.py).
