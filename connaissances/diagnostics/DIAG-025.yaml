id: DIAG-025
title: Arrêt par manque de temps CPU sous le délai par défaut de aster-expert run
summary: aster-expert run impose son délai (execution.timeout_seconds, 1 800 s) et sa mémoire
  (8 192 Mio) à Code_Aster, quelles que soient les valeurs de l'.export ; un calcul plus long
  s'arrête sur SUPERVIS_63 (« ARRET PAR MANQUE DE TEMPS CPU »).
