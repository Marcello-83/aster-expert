topic: Combinaisons d'actions ELU et ELS
option_retained: 'Combinaisons de l''EN 1990, avec les coefficients usuels.


  *Classement des actions.*

  - **Permanentes :**

  - G, poids propre et poussée des terres ;

  - EAU_P, pression d''eau différentielle permanente, traitée comme une action permanente
  avec G et affectée du même coefficient.

  - **Variables :**

  - Q1, surcharge de terre-plein : ψ0 = 0,7, ψ1 = 0,5, ψ2 = 0,3 ;

  - Q3, amarrage : ψ0 = 0,7, ψ1 = 0,5, ψ2 = 0.

  - **Accidentelle :** A, accostage, qui ne se cumule qu''avec EAU_A (nappe accidentelle)
  à la place d''EAU_P.


  *Coefficients partiels.* γG = 1,35 (défavorable) ou 1,00 (favorable), appliqué à G + EAU_P
  considérés comme un bloc ; γQ = 1,50.


  *Combinaisons*, avec Q1 et Q3 tour à tour en action dominante, et chaque action variable
  présente ou absente :

  - **ELU fondamentale :** γG (G + EAU_P) + 1,5 Q_dom + 1,5 ψ0 Q_acc ;

  - **ELU accidentelle :** (G + EAU_A) + A + 0,5 Q1, sans Q3 : amarrage et accostage ne sont
  pas simultanés.

  - **ELS caractéristique :** (G + EAU_P) + Q_dom + ψ0 Q_acc ;

  - **ELS fréquente :** (G + EAU_P) + ψ1 Q_dom + ψ2 Q_acc ;

  - **ELS quasi permanente :** (G + EAU_P) + ψ2 Q1 + ψ2 Q3.


  Le résultat est une enveloppe par famille de combinaisons, où chaque extremum d''effort
  est accompagné des efforts concomitants.'
justification: Ce sont les combinaisons usuelles de l'EN 1990 pour un ouvrage portuaire, avec
  les coefficients habituels, sans spécificité propre à ce cas de test. L'amarrage et l'accostage
  sont traités comme non simultanés, parce qu'un navire n'est pas amarré au poste qu'il est
  en train d'accoster. La pression d'eau permanente, liée au niveau de nappe, suit les actions
  permanentes.
validity_domain: '- Les coefficients ψ de Q1 et Q3 sont des valeurs usuelles non justifiées
  par un référentiel portuaire propre au projet.

  - Conformément à la décision 7 (D15), le modèle n''est représentatif que pour les effets
  des charges localisées. Les efforts des tubes et des palplanches sous G, EAU et Q1 relèvent
  du calcul géotechnique amont : leurs combinaisons issues de ce modèle ne sont pas des efforts
  de dimensionnement des tubes. Pour la poutre de couronnement, les charges de terre et d''eau
  uniformes ne produisent pas de flexion dans son plan (lot 37), et ses efforts sont dominés
  par Q3 et A.'
discarded_variants:
- 'Amarrage (Q3) et accostage (A) simultanés. — écartée : Un navire n''est pas amarré au poste
  qu''il est en train d''accoster ; les deux actions ne sont pas concomitantes.'
- 'Pression d''eau permanente (EAU_P) traitée comme action variable. — écartée : Elle résulte
  du niveau de nappe permanent et suit les actions permanentes ; elle est affectée du même
  coefficient que G.'
- 'Accostage traité comme action variable en combinaison fondamentale (γQ = 1,5). — écartée
  : L''effort de 800 kN est défini par le cas de test comme une situation accidentelle, associée
  à la nappe haute (§7, cas A).'
- 'Coefficients γG distincts pour G et pour EAU_P. — écartée : Les deux actions varient ensemble
  ; les traiter comme un seul bloc limite le nombre de combinaisons sans perte de pertinence
  pour un cas de test.'
