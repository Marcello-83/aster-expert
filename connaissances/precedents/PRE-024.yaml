topic: 'Valeurs et application des charges : poids volumique, g, forme de la charge d''exploitation'
option_retained: 'Deux cas de charge calculés séparément, chacun comparé à Navier. G : poids
  propre, poids volumique 25 kN/m³, appliqué par PESANTEUR avec g = 9,81 m/s² et RHO = 25
  000 / 9,81 = 2 548,42 kg/m³, de façon que ρ·g vaille exactement 25 kN/m³ ; résultante attendue
  25 × 6 × 4 × 0,30 = 180,0 kN. Q : exploitation de 10 kPa en charge surfacique de direction
  globale −Z (FORCE_COQUE/FZ), et non en PRES, pour ne pas dépendre de l''orientation des
  normales ; résultante attendue 240,0 kN.'
justification: Décision P3 de MM.
validity_domain: 'Exploitation uniforme sur toute la dalle ; aucune disposition partielle.
  RHO est un artifice pour obtenir ρ·g = 25 kN/m³ (le poids volumique du béton armé, pas sa
  masse volumique réelle) : il n''est valable qu''en statique.'
