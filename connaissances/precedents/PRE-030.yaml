point_label: '14'
topic: 'Ferraillage : acier, distance parement–axe, ELS en XC1 (contraintes, fissuration),
  ferraillage minimal'
option_retained: 'Acier B500B, fyk = 500 MPa. γc = 1,5 et γs = 1,15 en situation durable ;
  ALPHA_CC = 1,0 écrit explicitement dans le .comm (la valeur par défaut 0,85 n''est pas retenue).
  Barres HA12 dans les deux directions, nappes inférieure et supérieure. Distance du parement
  à l''axe, enrobage nominal 30 mm : lit extérieur (barres portant dans la petite portée,
  Y) 30 + 6 = 36 mm ; lit intérieur (barres portant dans la grande portée, X) 30 + 12 + 6
  = 48 mm. CALC_FERRAILLAGE n''admet qu''une distance par face en 2D (catalogue 17.4 : C_INF
  et C_SUP, un réel chacun) : 48 mm est retenu pour les deux directions et déclaré ; la contre-vérification
  manuelle utilise la même valeur. ELS en XC1 : wk limite = 0,4 mm sous combinaison quasi
  permanente ; σs ≤ 0,8 fyk sous combinaison caractéristique ; pas de limite sur σc en XC1.
  Ferraillage minimal : non-fragilité As,min = max(0,26·fctm/fyk ; 0,0013)·b·d ; maîtrise
  de la fissuration en flexion simple, kc = 0,4, k = 1,0, fct,eff = fctm, Act = b·h/2 ; armatures
  de répartition ≥ 20 % des armatures principales. Méthode 2D native de CALC_FERRAILLAGE pour
  les plaques ; contre-vérification indépendante au centre de la dalle (Mxy nul par symétrie)
  ; coins relevés et commentés, armatures de coin signalées, non calculées.'
justification: 'Décision P6 de MM. Distance à l''axe selon PRE-018 (enrobage mesuré au nu
  de l''armature). Maîtrise de la fissuration : application de D21 (PRE-020, décision de MM
  sur la poutre de couronnement du quai, EN 1992-1-1, 7.3.2) à une pièce fléchie : Act est
  la zone tendue complète de la section avant fissuration, soit b·h/2 en flexion ; kc = 0,4
  dépend de la sollicitation ; k = 1,0 dépend de h (h ≤ 300 mm). Correction du lot 45 : l''arbitrage
  v1 et la fiche du lot 43 présentaient kc = 0,4 et Act = b·h/2 comme une exception à D21
  (« PRE-021 », identifiant qui n''a jamais existé : D21 est PRE-020) ; c''est l''application
  de D21.'
validity_domain: 'Une seule distance (48 mm) pour les deux directions : défavorable pour le
  lit extérieur (Y, 36 mm réels). wk = 0,4 mm est la valeur recommandée du tableau 7.1N ;
  MM vérifie le tableau 7.1NF de l''annexe nationale. Armatures de coin (9.3.1.3) non calculées.'
discarded_variants:
- 'ALPHA_CC = 0,85 (défaut de CALC_FERRAILLAGE). — écartée : Annexe nationale française :
  αcc = 1,0, comme au quai (P6).'
- 'Deux distances par face (36 mm en Y, 48 mm en X). — écartée : Une seule distance par face
  en 2D dans CALC_FERRAILLAGE ; 48 mm, sécuritaire, est retenu (P6).'
- 'Précédent PRE-017 (XS3, wk = 0,2 mm, enrobage 65 mm du quai). — écartée : Exposition XC1
  et enrobage de 30 mm donnés par MM.'
- 'Calcul des armatures de coin (9.3.1.3). — écartée : Signalées, non calculées (P6).'
