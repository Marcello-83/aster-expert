topic: Objet et périmètre du calcul
option_retained: 'Le modèle Code_Aster est un calcul de structure tridimensionnel. Il ne dimensionne
  pas géotechniquement l''écran : cette part relève d''un logiciel dédié aux écrans de soutènement,
  qui fournit en amont les profils de poussée et les raideurs de réaction du sol. Ce modèle
  traite la diffusion d''un effort d''amarrage ponctuel dans l''écran, la répartition des
  efforts entre tubes et palplanches intercalaires, le travail de la poutre de couronnement
  en flexion horizontale et en torsion, et les effets tridimensionnels qu''un calcul en tranche
  bidimensionnelle ne capte pas. Il ne traite pas la stabilité d''ensemble, la vérification
  de la fiche, l''équilibre des poussées et butées, ni le dimensionnement géotechnique des
  tirants.'
justification: La vérification géotechnique d'un écran — équilibre poussée-butée, fiche, stabilité
  — est couverte en agence par un logiciel dédié (K-Réa), qui porte la démarche propre à ce
  type d'ouvrage. Ce que ce logiciel ne fournit pas, c'est la réponse tridimensionnelle de
  la structure sous charges localisées. C'est ce besoin, et lui seul, qui justifie un modèle
  Code_Aster ; lui donner un périmètre plus large reviendrait à dupliquer un calcul existant
  avec un outil moins adapté.
validity_domain: La validité de ce calcul dépend entièrement de la qualité des données fournies
  en amont — profils de poussée et raideurs de sol — qu'il ne vérifie pas. Il ne peut servir
  ni à justifier la fiche, ni à justifier la stabilité de l'écran.
discarded_variants:
- 'Calcul géotechnique complet sous Code_Aster. — écartée : Un logiciel dédié le fait mieux
  et c''est sa place ; reproduire sa démarche ici n''apporterait rien et demanderait de mailler
  le sol.'
