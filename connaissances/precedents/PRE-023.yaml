topic: Choix de la modélisation de plaque de la dalle (h/L = 1/13,3)
option_retained: Modélisation DKT (Love-Kirchhoff) pour toute la dalle.
justification: 'Décision P1 de MM : avec h/L = 0,30/4,00 = 1/13,3, la part de cisaillement
  transverse dans la flèche d''une bande simplement appuyée vaut environ 0,8·E/(κG)·(h/L)²,
  soit à peu près 1,3 % avec ν = 0,2 et κ = 5/6, négligeable devant la précision d''ingénieur
  ; les moments d''une plaque appuyée y sont peu sensibles. La référence du niveau E est Kirchhoff
  (Navier) : DKT est la seule modélisation qui rend la comparaison exacte, sans correction.'
validity_domain: Déformation d'effort tranchant négligée (environ 1,3 % de la flèche selon
  l'estimation de MM) ; aucune étude de sensibilité DST dans ce lot.
discarded_variants:
- 'DST (cisaillement transverse), y compris en sensibilité. — écartée : Ajoute un écart de
