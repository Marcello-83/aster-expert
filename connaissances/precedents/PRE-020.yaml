point_label: '14'
topic: Maîtrise de la fissuration de la poutre de couronnement (section minimale, contrainte
  de l'acier)
option_retained: 'As,min selon l''EN 1992-1-1, 7.3.2. Act est égale à la zone tendue complète
  de la section avant fissuration, soit b·h/2 en flexion. kc dépend de la sollicitation. k
  dépend de h : 0,65 pour h ≥ 800 mm. fct,eff = fctm. σs est tirée du tableau 7.2N, avec la
  correction 7.6N, pour φ = 40 mm et wk = 0,2 mm.'
justification: Lecture littérale de 7.3.2, retenue par MM pour la poutre de couronnement.
validity_domain: 'Lecture littérale de Act, par opposition à une aire effective hc,eff. Pour
  une pièce massive, elle est plus pénalisante : environ 68 cm² sur les faces AY et 91 cm²
  sur les faces AZ. Sur les faces AZ, φ*s sort du tableau 7.2N et σs est bornée à 160 MPa.
  MM confirmera la transcription complète du tableau 7.2N sur son exemplaire.'
discarded_variants:
- 'Act limitée à une hauteur effective hc,eff autour des aciers. — écartée : Non retenue par
  MM pour cet ouvrage, qui préfère la lecture littérale de 7.3.2.'
