summary: 'Une plaque reliée à une poutre par ses nœuds se lit au nu de la poutre : les nœuds
  à moins de b/2 de la ligne sont hors de la valeur de dimensionnement (gardés en valeur d''axe
  pour comparaison), en plus des disques autour des appuis ponctuels (PAT-013).'
