problem: 'Le long d''une ligne de nœuds partagés avec une poutre, la plaque porte un effort
  d''interaction nodal (CA-058) : ses valeurs sur la ligne et à ses voisins immédiats n''ont
  pas de sens physique et dépendent du maillage ; une lecture « hors disques » ne les écarte
  pas (une ligne n''est pas un disque).'
solution: 'Déclarer sur la famille de poutres une bande de demi-largeur b/2 (exclusion_band)
  : tout nœud de plaque à moins de b/2 (strictement) d''un nœud de la poutre est exclu de
  la valeur de dimensionnement de toutes les familles de coque ; le nu (distance b/2) est
  lu ; les disques PAT-013 restent ; les valeurs de la bande sont rapportées en « axe (comparaison)
  ».'
fragment: "exclusion_band:\n  half_width: 0.60\n  source: \"E26 de MM\"\n"
fragment_language: python
conditions: Poutre de largeur b au plan moyen d'une plaque, nœuds partagés ; appui monolithique
  (lecture au nu). La demi-largeur est une décision de lecture, déclarée avant la lecture.
