problem: Représenter une palplanche (rigidités par unité de largeur différentes selon L et
  T) en coque.
solution: DEFI_MATERIAU/ELAS_COQUE (groupe MEMB_* … CISA_* complet, RHO masse volumique),
  AFFE_CARA_ELEM/COQUE avec EPAIS et VECTEUR ; efforts par EFGE_NOEU ; équilibre par les ressorts
  ou des appuis sans ELAS_COQUE.
fragment: "MAT_PALP = DEFI_MATERIAU(\n    ELAS_COQUE=_F(\n        MEMB_L=2908000000.0, MEMB_T=81000.0,\
  \ MEMB_G_LT=526000000.0, MEMB_LT=0.0,\n        FLEX_L=89000000.0, FLEX_T=11300.0, FLEX_G_LT=8400.0,\
  \ FLEX_LT=0.0,\n        CISA_L=526000000.0, CISA_T=526000000.0, RHO=7850.0,\n    )\n)\n\
  COQUE=_F(GROUP_MA=(\"PALPS\",), EPAIS=0.01385, VECTEUR=(0.0, 0.0, 1.0)),"
fragment_language: comm
conditions: DKT QUAD4 ; torsion (FLEX_G_LT, MXY), couplages, COQUE_3D et DST non testés ;
  RHO × EPAIS fait le poids (CA-024).
