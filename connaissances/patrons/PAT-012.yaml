problem: Évaluer des enveloppes et des combinaisons sur des centaines de positions d'une charge
  roulante sans écrire un cas à la main par position ni saturer la mémoire.
solution: Taille de maille qui divise tous les bords d'empreinte aux pas de déplacement ;
  groupes d'essieu par INTERSEC d'une bande X et d'une bande Y (CRIT_NOEUD='TOUS') ; lots
  de 25 cas par MACRO_ELAS_MULT avec OPTION='SANS', champs restreints (EFGE_NOEU de la dalle,
  EFGE_ELNO des poutres) écrits au MED puis le résultat détruit ; tous les pas lus par medcoupling
  (extract_steps), enveloppes et combinaisons calculées sur le poste.
fragment: "MB01 = MACRO_ELAS_MULT(MODELE=MODELE, CHAM_MATER=CHMAT, CARA_ELEM=CARA,\n    CHAR_MECA_GLOBAL=CL,\n\
  \    CAS_CHARGE=(\n        _F(NOM_CAS=\"TSA_M29\", CHAR_MECA=CH_TSA_M29, OPTION=\"SANS\"\
  ),\n        _F(NOM_CAS=\"TSA_M28\", CHAR_MECA=CH_TSA_M28, OPTION=\"SANS\"),\n    ),\n  \
  \  SOLVEUR=_F(METHODE=\"MUMPS\", POSTTRAITEMENTS=\"FORCE\"))"
fragment_language: comm
conditions: Élasticité linéaire ; empreintes rectangulaires alignées sur une grille régulière
  ; CHAR_MECA en référence simple (validateur de niveau B).
