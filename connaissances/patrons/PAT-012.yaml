id: PAT-012
title: 'Charges mobiles : positions en lots de MACRO_ELAS_MULT, empreintes alignées, enveloppes
  hors Code_Aster'
summary: 'Les positions d''une charge mobile s''écrivent par un générateur : une charge FORCE_COQUE
  par position sur des empreintes réunions de mailles entières (bandes CREA_GROUP_MA/BANDE
  intersectées), résolues en lots de MACRO_ELAS_MULT (OPTION=''SANS'', une factorisation par
  lot, DETRUIRE après IMPR_RESU), puis enveloppées et combinées sur le poste à partir du MED.'
