problem: Représenter l'appui simple de Navier (coins retenus) sans redondance de conditions
  (DIAG-001) ni mouvement de corps rigide dans le plan.
solution: DDL_IMPO DZ sur le groupe des bords, DX et DY en P_A, DY en P_B ; ORIE_NORM_COQUE
  VECT_NORM = (0, 0, 1) pour que la face « supérieure » de CALC_FERRAILLAGE soit le dessus
  (CA-045) ; ANGL_REP = (0, 0) pour x_l = X ; symétrie contrôlée, pas imposée.
fragment: "CL = AFFE_CHAR_MECA(\n    MODELE=MODELE,\n    DDL_IMPO=(\n        _F(GROUP_NO=\"\
  APPUIS\", DZ=0.0),\n        _F(GROUP_NO=\"P_A\", DX=0.0, DY=0.0),\n        _F(GROUP_NO=\"\
  P_B\", DY=0.0),\n    ),\n)"
