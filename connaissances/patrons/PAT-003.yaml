problem: Appliquer un profil de pression par couches, discontinu aux interfaces, sur des coques
  à normales hétérogènes.
solution: MODI_MAILLAGE/ORIE_NORM_COQUE vers le côté chargé ; groupes de couche par CREA_GROUP_MA/BANDE
  (CRIT_NOEUD="TOUS") intersectés avec la surface chargée ; une fonction DEFI_FONCTION par
  couche ; VERI_NORM="NON" seulement après contrôle explicite des normales (CTL-007).
fragment: "CH_G_POUSSEE = AFFE_CHAR_MECA_F(\n    MODELE=MO, VERI_NORM=\"NON\",\n    FORCE_COQUE=(\n\
  \        _F(GROUP_MA=(\"GEN_COUCHE_MARNE\",), PRES=F_G_MARNE),\n        _F(GROUP_MA=(\"\
  GEN_COUCHE_ARGILE\",), PRES=F_G_ARGILE),\n    ),\n)"
fragment_language: comm
conditions: Interfaces de couche alignées sur des rangées de nœuds (sinon une maille reste
  sans pression, signalée par l'équilibre seulement) ; DKT QUAD4 plans.
