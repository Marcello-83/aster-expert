problem: Appliquer un effort d'accostage connu (N) sur une empreinte de tube facetté.
solution: Intensité = effort / surface développée des mailles du groupe ; AFFE_CHAR_MECA/FORCE_COQUE
  avec FX, FY, FZ (repère global), jamais PRES.
