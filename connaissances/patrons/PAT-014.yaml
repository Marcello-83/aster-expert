problem: 'Une poutre au plan moyen d''une plaque, nœuds partagés (chevêtre sous une dalle)
  : la plaque et la barre se partagent l''effort à chaque nœud. La part de la barre change
  avec la formulation de plaque (effort tranchant près d''un appui : 27 % en DKT, 90 % en
  DST, CA-058) et avec le maillage ; un ferraillage fait sur la barre seule peut être faux
  d''un facteur 3 à 4.'
solution: 'Déclarer la section en T (largeur ±b/2 de part et d''autre de la ligne, b la largeur
  de la poutre) : N_T = N + ∫NYY, M_T = MFY + ∫MYY, V_T = VZ + ∫QY par trapèzes sur les nœuds
  de plaque de même abscisse, cas par cas ; dimensionner sur ce total à tous les états limites
  ; garder la barre seule en colonne de traçabilité ; prouver la lecture par l''équilibre
  d''une coupe (moyenne des deux extrémités d''élément au nœud de la coupe, moments nodaux
  consistants des charges réparties non comptés).'
fragment: "tee_section:\n  plate_family: tablier\n  half_width: 0.60\n  across: X\n  along:\
  \ Y\n  parts:\n    - {beam: N, plate: NYY}\n    - {beam: MFY, plate: MYY}\n    - {beam:\
  \ VZ, plate: QY}\n"
fragment_language: python
conditions: 'Poutre et plaque au même plan moyen (E20), repère de plaque égal au repère global
  (ANGL_REP = (0, 0)), lecture EFGE_NOEU de la plaque et EFGE_ELNO de la barre. Le signe des
  parts dépend du repère local de la poutre : le vérifier par une coupe en console (isostatique).'
