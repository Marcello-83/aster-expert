problem: Représenter un sol par des ressorts nodaux de raideur k_h × aire tributaire, variable
  par couche, sur des milliers de nœuds, sans perdre la raideur aux nœuds communs à deux couches.
solution: Grouper les nœuds de même raideur (mêmes VALE) en classes ; une occurrence CREA_POI1
  par classe, DIS_T sur les POI1, DISCRET K_T_D_N et M_T_D_N = 0 par classe ; un nœud partagé
  reçoit une classe commune de raideur sommée, écrite après les autres (CREA_POI1 ne crée
  qu'une maille par nœud).
fragment: "MAIL = CREA_MAILLAGE(\n    MAILLAGE=MAIL,\n    CREA_POI1=(\n        _F(NOM_GROUP_MA=\"\
  GEN_RESS_ARGI_01\", GROUP_NO=(\"GEN_RESS_ARGI_01\",)),\n    ),\n)\nCARA = AFFE_CARA_ELEM(\n\
  \    MODELE=MO,\n    DISCRET=(\n        _F(GROUP_MA=(\"GEN_RESS_ARGI_01\",), CARA=\"K_T_D_N\"\
  , VALE=(0.0, 76015.34812908873, 0.0)),\n        _F(GROUP_MA=(\"GEN_RESS_ARGI_01\",), CARA=\"\
  M_T_D_N\", VALE=(0.0,)),\n    ),\n)"
fragment_language: comm
conditions: Élasticité linéaire (ressorts bilatéraux) ; la tolérance de comparaison de deux
  raideurs sur maillage irrégulier n'est pas établie ; ressorts appuis, sans masse (DIAG-004).
