problem: Ferrailler une plaque sur des combinaisons EN 1990 alors que les combinaisons du
  tronc commun (lot 41) ne combinent que des tables d'efforts de poutre.
solution: 'Énumérer les combinaisons (aster_expert.combinaisons.enumeration) et écrire un
  MECA_STATIQUE par combinaison ; le résultat porte EFGE_ELNO et se ferraille en 2D. Vérifié
  au centre de la dalle : ELU = 1,35 G + 1,5 Q à 4e-13 près.'
fragment: "F_RC01_G = DEFI_CONSTANTE(VALE=1.35)\nF_RC01_Q = DEFI_CONSTANTE(VALE=1.5)\nRC01\
  \ = MECA_STATIQUE(\n    MODELE=MODELE, CHAM_MATER=CHMAT, CARA_ELEM=CARA,\n    EXCIT=(_F(CHARGE=CL),\
  \ _F(CHARGE=CH_G, FONC_MULT=F_RC01_G), _F(CHARGE=CH_Q, FONC_MULT=F_RC01_Q)),\n)"
fragment_language: comm
conditions: Élasticité linéaire, Code_Aster 17.4.0 ; les conditions aux limites (CL) sans
  multiplicateur.
