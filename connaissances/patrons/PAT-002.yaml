problem: Relier une coque (tube facetté) à une poutre transversale en T, à plusieurs appuis,
  dans un modèle à plans de symétrie.
solution: LIAISON_SOLIDE par tube ; au plan de symétrie, DDL_IMPO DX/DRY/DRZ sur le groupe
  du plan privé des nœuds d'anneau (DEFI_GROUP/DIFFE) ; lire les réactions sur les seules
  composantes bloquées (CA-036).
