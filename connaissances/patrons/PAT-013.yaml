problem: Une plaque reliée en un seul nœud à un appui (pieu, poteau, appui ponctuel) reçoit une
  force et un couple ponctuels ; l'effort tranchant (en 1/r) et le moment (en log r) y sont
  singuliers. Le maximum nodal sur toute la plaque tombe alors au nœud d'appui ou à ses voisins,
  dépend du maillage (dans Code_Aster comme dans un autre logiciel) et n'a pas de limite au
  raffinement ; le comparer à une valeur publiée ne dit rien du modèle.
solution: 'Avant l''exécution, déclarer pour chaque point de comparaison de la plaque son lieu
  de lecture : maximum hors des disques fermés de rayon r centrés sur les nœuds d''appui (r
  de l''ordre de la largeur de l''appui ou de la poutre d''appui ; 0,60 m à l''estacade, E17.3),
  ou une grandeur intégrée (moyenne de section, total d''une section en T, CA-058). Vérifier la
  singularité par une suite de raffinement (CTL-012 n''est pas applicable : la grandeur n''a pas
  de limite) : une valeur qui double à chaque division de la maille est singulière.'
fragment: "near = np.zeros(len(x), dtype=bool)\nfor p in supports:\n    near |= np.hypot(x - p.x,\
  \ y - p.y) <= RADIUS + 1e-9\naway = ~near  # lecture des maxima sur les seuls nœuds `away`"
fragment_language: python
conditions: 'Plaque DKT ou DST, appui en un nœud (sans répartition sur une surface d''appui) ;
  lecture des efforts nodaux EFGE_NOEU. Le rayon est une décision de lecture, déclarée avant
  l''exécution ; il ne corrige pas le modèle.'
