# Lot 41, étape 4 : résumé en une phrase de chacun des 45 constats `code_aster` de la
# fiche du quai, dans l'ordre de la fiche. Rédigés par la session du lot 41 à partir
# du texte retenu (`option_retained`) de chaque constat, sans rien y ajouter ; chaque
# ligne porte le début du sujet (`topic`) du constat qu'elle résume, contrôlé par
# scripts/extraire_constats_lot41.py.
- topic: "Familles d'éléments finis disponibles au catalogue pour représenter un écran"
  summary: "Le catalogue offre, pour un écran, des coques (COQUE_3D, DKT, DST, Q4G, DKTG, Q4GG), des poutres (POU_D_T, POU_D_E, POU_D_EM, POU_D_TG, POU_D_TGM), la barre BARRE et des massifs continus (3D, D_PLAN, AXIS), sans que le catalogue choisisse entre eux."
- topic: "Critère d'élancement"
  summary: "Les modélisations de plaque DKT, DST, DKTG et Q4G supposent une épaisseur inférieure à environ un dixième de la longueur caractéristique."
- topic: "Formulation de COQUE_3D"
  summary: "COQUE_3D suit une cinématique générale de coque de type Naghdi-Reissner, tandis que POU_D_T, POU_D_E et BARRE ont chacune leurs propres degrés de liberté documentés."
- topic: "Contenu détaillé du tableau comparatif"
  summary: "Selon le tableau de U2.02.01, seules DKT et DST/Q4G acceptent un matériau orthotrope en statique linéaire, et seule COQUE_3D traite le non-linéaire géométrique."
- topic: "Familles d'éléments 1D à deux nœuds"
  summary: "Un tirant à deux nœuds peut être représenté au catalogue par BARRE, CABLE, CABLE_GAINE, DIS_T ou DIS_TR."
- topic: "Documentation générique des éléments BARRE"
  summary: "BARRE ne transmet que l'effort normal, et DIS_T/DIS_TR sont des raideurs ponctuelles portées par des mailles POI1 ou SEG2."
- topic: "Modélisations poutre disponibles"
  summary: "Les modélisations de poutre offertes par AFFE_MODELE sont POU_D_T, POU_D_E, POU_D_EM, POU_D_TG et POU_D_TGM."
- topic: "Liaison de corps solide entre un anneau"
  summary: "LIAISON_SOLIDE accepte dans une même occurrence plusieurs groupes de nœuds (anneau de coque et nœud de poutre), qui forment alors un seul corps rigide, une occurrence par jonction."
- topic: "Modélisations disponibles pour un sol stratifié"
  summary: "Un sol stratifié se modélise en massif continu 3D, D_PLAN ou AXIS en mécanique pure, ou par les variantes HM et THM en couplage hydromécanique."
- topic: "Mécanisme catalogue de contact-frottement"
  summary: "Le contact-frottement de Code_Aster ne détecte aucune interface : les surfaces de contact sont définies à la main par l'utilisateur."
- topic: "Alternatives catalogue à un contact surfacique"
  summary: "À la place d'un contact surfacique, une interface sol-écran peut être représentée par des ressorts discrets (DIS_CHOC, DIS_CONTACT) ou par des éléments de joint (3D_JOINT, PLAN_JOINT)."
- topic: "Pression répartie fonction de Z sur des coques DKT"
  summary: "Une pression fonction de Z sur des coques DKT s'écrit par AFFE_CHAR_MECA_F/FORCE_COQUE/PRES avec une FORMULE, jamais par PRES_REP, qui ne cite pas DKT et refuse les fonctions sur COQUE_3D."
- topic: "Fonction de DEFI_CHAR_SOL"
  summary: "Piège : DEFI_CHAR_SOL produit une charge sismique pour la dynamique et n'est pas un outil de poussée statique des terres."
- topic: "Opérateurs de résolution non linéaire"
  summary: "Les calculs non linéaires passent par STAT_NON_LINE ou DYNA_NON_LINE, et U4.51.11 donne le domaine d'application de chaque comportement."
- topic: "Lois de comportement de sol/roche/joint"
  summary: "Le catalogue offre plusieurs lois de sol, de roche et de joint (MOHR_COULOMB, DRUCK_PRAGER, CAM_CLAY, MCC, HOEK_BROWN, HUJEUX et d'autres), chacune documentée par sa notice R."
- topic: "Mots-clés catalogue de blocage par degré de liberté"
  summary: "Le blocage par degré de liberté se fait par AFFE_CHAR_MECA/DDL_IMPO sur DX à DRZ, les nœuds étant désignés par GROUP_NO, GROUP_MA ou TOUT."
- topic: "Modélisations de coque recevables pour le tube"
  summary: "Pour une coque courbe, U2.02.01 admet DKT sur facettes comme COQUE_3D sans les départager, et DKQ n'est pas une valeur de MODELISATION."
- topic: "Application d'une force surfacique de direction globale fixe"
  summary: "Une force surfacique de direction fixe sur des coques courbes s'applique par FORCE_COQUE avec FX, FY et FZ en repère global, et non par la composante PRES."
- topic: "Application d'une force et d'un moment nodaux"
  summary: "Une force et un moment nodaux sur un nœud de poutre s'appliquent par FORCE_NODALE avec FX à MZ, en repère global par défaut."
- topic: "Affectation, à des nœuds existants d'un maillage"
  summary: "Des raideurs nodales propres à chaque nœud s'affectent par la chaîne CREA_POI1, DIS_T et DISCRET/K_T_D_N, en regroupant les nœuds de même raideur par classe plutôt qu'une occurrence par nœud."
- topic: "Surface de référence de l'intensité de FORCE_COQUE"
  summary: "Piège : l'intensité de FORCE_COQUE se rapporte à la surface développée des mailles et non à leur surface projetée."
- topic: "Unité des rigidités de flexion de ELAS_COQUE"
  summary: "FLEX_L et FLEX_T d'ELAS_COQUE sont des rigidités par unité de largeur, et L est l'axe x_l du repère utilisateur fixé par ANGL_REP ou VECTEUR."
- topic: "Résultante des réactions nodales (REAC_NODA) sous ELAS_COQUE"
  summary: "Piège : sous ELAS_COQUE, REAC_NODA, FORC_NODA et SIEF_ELGA sont calculés avec une rigidité de flexion MEMB × EPAIS²/12 et sont faux dès que FLEX_L ou FLEX_T en diffère."
- topic: "Poids propre des éléments ELAS_COQUE sous PESANTEUR"
  summary: "Piège : sous PESANTEUR, RHO d'ELAS_COQUE agit comme une masse volumique multipliée par EPAIS, et RHO = 0 annule le poids de ces éléments sans alarme."
- topic: "Efforts généralisés (EFGE_ELNO, EFGE_NOEU) sous ELAS_COQUE"
  summary: "Sous ELAS_COQUE (DKT), les efforts généralisés EFGE_ELNO et EFGE_NOEU sont exacts et indépendants de EPAIS et de CISA_L/CISA_T : ce sont eux qu'il faut lire."
- topic: "Contrôle d'équilibre global d'un modèle contenant des éléments ELAS_COQUE"
  summary: "Piège : l'équilibre d'un modèle ELAS_COQUE se contrôle par les forces des ressorts ou par REAC_NODA aux seuls appuis sans élément ELAS_COQUE, la somme de REAC_NODA sur tous les nœuds étant juste sans rien discriminer."
- topic: "Orientation des axes L et T d'ELAS_COQUE pour une coque dans un plan vertical"
  summary: "Pour une coque dans le plan vertical XZ, VECTEUR = (0, 0, 1) place l'axe L d'ELAS_COQUE selon Z, et ANGL_REP = (0, −90) lui est équivalent."
- topic: "Orientation cohérente des normales de coque"
  summary: "Pour qu'une pression positive agisse du bon côté, les normales de coque s'orientent par MODI_MAILLAGE/ORIE_NORM_COQUE avant l'affectation de la charge."
- topic: "Évaluation aux nœuds de FORCE_COQUE/PRES"
  summary: "Piège : Code_Aster évalue la fonction de FORCE_COQUE/PRES aux nœuds, si bien qu'une marche de pression écrite en rampe déborde d'une demi-maille et doit être appliquée couche par couche."
- topic: "Conditions de symétrie par rapport à un plan X = constante pour des coques DKT"
  summary: "La symétrie par rapport à un plan X = constante bloque DX, DRY et DRZ, de la même façon pour les nœuds de coque DKT et de poutre POU_D_E."
- topic: "Élément de barre : section, matériau"
  summary: "Un tirant BARRE ne porte que DX, DY et DZ au nœud commun avec la coque et n'y transmet aucune rotation."
- topic: "Mécanisme documentaire du pivot nul de LIAISON_SOLIDE"
  summary: "Piège : LIAISON_SOLIDE entre un anneau DKT et un nœud de poutre dualise la rotation DRZ des coques, qui n'a qu'une raideur fictive, ce qui peut produire un pivot nul (<F> <FACTOR_11>)."
- topic: "Charge linéique répartie et moment linéique sur un élément de poutre"
  summary: "Une charge et un moment linéiques sur une poutre s'écrivent dans une seule occurrence de FORCE_POUTRE (FY et MX en repère global), comme dans le cas test ssll119a."
- topic: "CREA_POI1 : une seule maille ponctuelle par nœud"
  summary: "Piège : CREA_POI1 ne crée qu'une maille par nœud, si bien qu'un nœud commun à deux classes de raideur ne garde que la dernière DISCRET écrite ; il faut une classe commune de raideur sommée."
- topic: "Charge répartie sur une poutre continue liée par plusieurs LIAISON_SOLIDE"
  summary: "Piège : une charge répartie FORCE_POUTRE sur une poutre continue liée par plusieurs LIAISON_SOLIDE arrête tout CALC_CHAMP ultérieur (<F> <CALCULEL2_92>) ; il faut des forces nodales tributaires."
- topic: "REAC_NODA aux nœuds liés par LIAISON_SOLIDE"
  summary: "Piège : aux nœuds liés par LIAISON_SOLIDE, REAC_NODA porte des composantes non bloquées non nulles, si bien qu'un bilan d'équilibre ne doit sommer que les composantes réellement bloquées."
- topic: "Identifiant de la modélisation de poutre de Timoshenko"
  summary: "La poutre de Timoshenko s'appelle POU_D_T dans AFFE_MODELE et a la même maille support et les mêmes six degrés de liberté que POU_D_E."
- topic: "Conditions de symétrie par rapport à un plan X = constante pour une poutre POU_D_T"
  summary: "POU_D_T a exactement les six degrés de liberté de POU_D_E, donc la même condition de symétrie DX = DRY = DRZ = 0 s'applique."
- topic: "État des lieux des commandes de ferraillage"
  summary: "En 17.4, CALC_FERRAILLAGE et COMBINAISON_FERRAILLAGE traitent le 1D, alors que VERI_FERRAILLAGE est limité au 2D et aux types ELU et ELS."
- topic: "CALC_FERRAILLAGE en 1D à l'ELU"
  summary: "En 1D, MFZ > 0 tend la face AYS et MFY > 0 la face AZS de CALC_FERRAILLAGE, et un couple intérieur au domaine du béton seul donne une aire nulle."
- topic: "Ferraillage minimal de CALC_FERRAILLAGE en 1D"
  summary: "Piège : FERR_MIN='EC2' n'est juste qu'en UNITE_CONTRAINTE='MPa', s'applique aux quatre faces même sans effort, et FERR_MIN_FISS est refusé pour les poutres."
- topic: "Flexion déviée en 1D dans CALC_FERRAILLAGE"
  summary: "Piège : sous MFY et MFZ simultanés, CALC_FERRAILLAGE ne fait pas une vraie flexion déviée mais majore les aires de 10 % par itération jusqu'à vérifier l'inéquation de Bresler."
- topic: "Effort tranchant et torsion en 1D dans CALC_FERRAILLAGE"
  summary: "En 1D, AST est une seule densité de cadres (θ = 21,8°, maximum des deux directions) qui intègre la torsion, sans armature longitudinale de torsion ni critère de bielle en sortie."
- topic: "ELS caractéristique et ELS quasi permanent en 1D"
  summary: "Piège : à l'ELS, les aires 1D de CALC_FERRAILLAGE s'écartent de 0,25 % à 16 % du calcul par pivot acier de R7.04.05, pour une cause non établie."
- topic: "CALC_FERRAILLAGE en 2D sur une plaque DKT"
  summary: "En 2D (Capra-Maury), MXX > 0 tend la face supérieure, et avec MXY les densités diffèrent de l'approximation de Wood-Armer, avec un ajout non expliqué dans un cas dégénéré."
