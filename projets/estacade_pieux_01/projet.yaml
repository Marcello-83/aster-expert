        - {header: Verdict, path: verdict}
    - section: controles
      title: Convergence de maillage de la dalle sous TS (h = 0,10 / 0,05 / 0,025 m)
      source: controles/convergence_lot47.json
      rows: verdicts
      columns:
        - {header: Grandeur, path: "$key"}
        - {header: "Écart 0,10-0,05", path: ecart_0p10_0p05}
        - {header: "Écart 0,05-0,025", path: ecart_0p05_0p025}
        - {header: "Écart de production", path: ecart_relatif_production}
