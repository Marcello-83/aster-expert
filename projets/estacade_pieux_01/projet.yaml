# Déclaration du projet ESTACADE-PIEUX-01 (lot 47) : contre-calcul d'un modèle non validé.
#
# Interface avec le tronc commun (schéma aster_expert.projet.declaration). Estacade sur
# pieux : tablier-dalle DKT sur sept chevêtres POU_D_T, quatorze pieux POU_D_T à ressorts
# de sol horizontaux, appui vertical en pointe. Décisions E1 à E16 de MM, choix U1 à U6
# de l'agent (fiche). Chemins relatifs au répertoire du projet.
schema_version: 1
name: estacade_pieux_01
structure: ESTACADE-PIEUX-01
description: >-
  Estacade sur pieux, contre-calcul d'un modèle d'avant-projet non validé : dalle de
  31,20 × 6,00 × 0,40 m (DKT) sur 7 chevêtres de 1,20 × 0,90 m (POU_D_T, au plan
  moyen), 14 pieux tubulaires corrodés (POU_D_T, tube équivalent par tronçon), ressorts
  horizontaux kx = ky tous les 0,50 m, DZ = 0 en pointe ; calcul linéaire ; charges
  PP, G2, UDL, TR, FR, TE± et 242 positions mobiles de TS et LM2 ; combinaisons 100 à
  115 du modèle source.
fiche: fiche/hypotheses_estacade_pieux_01.json
data: donnees/estacade_pieux_01_model_data.yaml
data_sources: donnees/sources
results: resultats
knowledge_applied: connaissances_appliquees.yaml
# Lot 48 bis : projet à données réelles ; la liste des termes interdits est obligatoire
# pour le contrôle de publication (variable ASTER_EXPERT_TERMES_INTERDITS, docs/cloud.md § 11).
confidential_data: true

mesh:
  script: maillage/estacade_mesh.py
  parameters: estacade_pieux_01.extensions:mesh_parameters
  invariants: maillage/invariants_h0p050.yaml

comm:
  generator: estacade_pieux_01.extensions:generate
  output: resultats/estacade_pieux_01.comm
  export:
    time_limit: 7200
    memory_limit: 10240
    mesh_unit: 20
    mesh_format: mmed
  required_data:
    - geometrie.longueur_tablier
    - geometrie.largeur_tablier
    - geometrie.epaisseur_dalle
    - geometrie.cote_plan_moyen
    - pieu.aires_troncons
    - pieu.inerties_troncons
    - ressorts.files_rive
    - ressorts.files_eau
    - materiaux.beton_module
    - materiaux.acier_module
    - charges.ts_charge_roue
    - charges.lm2_charge_roue
    - charges.fr_total
    - charges.delta_t

controls:
  threshold: 1.0e-6
  vertical: DZ
  output: equilibre.json
  # E4 : seul DZ est bloqué, aux pointes ; les ressorts reprennent DX et DY.
  supports:
    - {group: PIEDS, blocked: [DZ], table: "RP_{case}"}
  springs:
    groups: [RESSORTS]
    direction: [DX, DY]
    forces: estacade_pieux_01.extensions:spring_forces
  # Lot 47 bis (CTL-005, CTL-013 version 2) : TE+ et TE− sont autoéquilibrés (charge
  # nulle) ; leur écart est rapporté à l'échelle déclarée (Σ |k·u| des ressorts).
  cases:
    - {name: PP, gravity: true, expected_resultant: "estacade_pieux_01.extensions:resultant"}
    - {name: G2, expected_resultant: "estacade_pieux_01.extensions:resultant"}
    - {name: UDL, expected_resultant: "estacade_pieux_01.extensions:resultant"}
    - {name: TR, expected_resultant: "estacade_pieux_01.extensions:resultant"}
    - {name: FR, expected_resultant: "estacade_pieux_01.extensions:resultant"}
    - {name: TEP, expected_resultant: "estacade_pieux_01.extensions:resultant", self_equilibrated_scale: "estacade_pieux_01.extensions:spring_scale"}
    - {name: TEM, expected_resultant: "estacade_pieux_01.extensions:resultant", self_equilibrated_scale: "estacade_pieux_01.extensions:spring_scale"}
    - {name: TSA_P00, expected_resultant: "estacade_pieux_01.extensions:resultant"}
    - {name: TSB_P00, expected_resultant: "estacade_pieux_01.extensions:resultant"}
    - {name: L2A_M00, expected_resultant: "estacade_pieux_01.extensions:resultant"}
    - {name: L2B_M00, expected_resultant: "estacade_pieux_01.extensions:resultant"}
  # U6 : ouvrage entier, la symétrie est un contrôle (cas symétriques en X et en Y).
  symmetry_planes:
    - {normal: X, position: 15.6, table: "SYMETRIE_{case}", cases: [PP, G2, UDL, TR, TEP, TEM]}
    - {normal: Y, position: 0.0, table: "SYMETRIE_{case}", cases: [PP, G2, UDL, TR, TEP, TEM]}
  # Contrôle propre au projet : Σ DZ des pointes = charge des roues, pour les 242
  # positions mobiles ; double compte d'E2 chiffré.
  extra: estacade_pieux_01.extensions:extra_controls

# Paquet de résultats versionnable (lots 45, 46, 47) : ce que les notes lisent, sans MED.
# Section `contre_calcul` (lot 47) : contre-calcul d'un modèle non validé, jamais un
# niveau E.
results_package:
  items:
    - {section: controles, source: resultats/controles/controles_d.json}
    - {section: controles, source: resultats/controles/equilibre.json}
    - {section: controles, source: resultats/controles/controles_projet.json}
    - {section: controles, source: references/convergence_lot47.json}
    - {section: contre_calcul, source: resultats/comparaison/comparaison.json}
    - {section: contre_calcul, source: references/explications_lot47.json}
    # Lot 47 bis : comparaison v2 (E17, E18), variante E19, sonde S2, verdict D v1.
    - {section: contre_calcul, source: references/comparaison_v2_lot47bis.json}
    - {section: contre_calcul, source: references/variante_chevetre_0p80_lot47bis.json}
    - {section: contre_calcul, source: references/sonde_lot47bis_resultats.json}
    - {section: controles, source: references/controles_d_v1_lot47.json}
    # Lot 47 ter : plan factoriel {DKT, DST} × {0,90, 0,80}, maillages grossiers, contrôles.
    - {section: contre_calcul, source: references/plan_factoriel_lot47ter.json}
    - {section: contre_calcul, source: references/maillages_lot47ter.json}
    - {section: controles, source: references/controles_lot47ter.json}
    # Lot 47 quater : variantes déclarées H1 (bouchon mixte) et H2 (tablier à +1,50),
    # C6 à C8 barre seule sur les maillages grossiers, mesures de performance.
    - {section: contre_calcul, source: references/verdict_lot47quater.json}
    - {section: contre_calcul, source: references/maillages_barre_seule_lot47quater.json}
    - {section: controles, source: references/controles_lot47quater.json}
  # Critères de niveau D écrits avant l'exécution (lot 47, commit fa97116) ; harnais
  # v2 des cas autoéquilibrés (lot 47 bis, commit 5ad8e24), écrit après l'exécution
  # de production qu'il réévalue.
  criteria:
    - {level: D, document: docs/essais_lot47.md}
    - {level: D, document: docs/essais_lot47bis.md}
  note_tables:
    - section: contre_calcul
      title: Lot 47 quater, Q1 (H1, bouchon mixte de la tête à −0,80, DST, chevêtre 0,90) — critère du § 2.5, variante déclarée
      source: contre_calcul/verdict_lot47quater.json
      rows: q1.lignes
      columns:
        - {header: Rôle, path: role}
        - {header: Point, path: point}
        - {header: Ligne, path: ligne}
        - {header: Code_Aster, path: valeur}
        - {header: Source, path: source}
        - {header: Écart relatif, path: ecart}
        - {header: Écart de la base (S), path: ecart_base}
    - section: contre_calcul
      title: Lot 47 quater, Q2 (H2, plan du tablier à +1,50, DST, chevêtre 0,90) — critère du § 2.5, variante déclarée
      source: contre_calcul/verdict_lot47quater.json
      rows: q2.lignes
      columns:
        - {header: Rôle, path: role}
        - {header: Point, path: point}
        - {header: Ligne, path: ligne}
        - {header: Code_Aster, path: valeur}
        - {header: Source, path: source}
        - {header: Écart relatif, path: ecart}
        - {header: Écart de la base (S), path: ecart_base}
    - section: contre_calcul
      title: Comparaison v2 (lecture E17, cas TR d'E18) aux valeurs du modèle source (C1 à C13) — contre-calcul d'un modèle non validé
      source: contre_calcul/comparaison_v2_lot47bis.json
      rows: lignes
      columns:
        - {header: Point, path: point}
        - {header: Colonne, path: colonne}
        - {header: Code_Aster, path: code_aster}
        - {header: Source, path: source}
        - {header: Écart relatif, path: ecart_relatif}
        - {header: Tolérance, path: tolerance}
        - {header: Verdict, path: verdict}
        - {header: Règle de lecture, path: regle}
    - section: contre_calcul
      title: Variante E19 (chevêtre de 0,80 m) — C6, C7, C8, sans verdict
      source: contre_calcul/variante_chevetre_0p80_lot47bis.json
      rows: lignes
      columns:
        - {header: Point, path: point}
        - {header: Colonne, path: colonne}
        - {header: Code_Aster, path: code_aster}
        - {header: Source, path: source}
        - {header: Écart relatif, path: ecart_relatif}
    - section: contre_calcul
      title: Plan factoriel du lot 47 ter — lignes du critère de l'hypothèse (SH = DST et chevêtre de 0,80 m), sans changement de la référence
      source: contre_calcul/plan_factoriel_lot47ter.json
      rows: lignes_du_critere.SH
      columns:
        - {header: Point, path: point}
        - {header: Ligne, path: colonne}
        - {header: Code_Aster (SH), path: code_aster}
        - {header: Source, path: source}
        - {header: Écart relatif, path: ecart_relatif}
        - {header: Tolérance, path: tolerance}
    - section: contre_calcul
      title: Dépendance au maillage des grandeurs locales (SH, dalle de 0,05 / 0,25 / 0,50 m)
      source: contre_calcul/maillages_lot47ter.json
      rows: lignes
      columns:
        - {header: Point, path: point}
        - {header: Ligne, path: colonne}
        - {header: Source, path: source}
        - {header: "h = 0,05", path: "valeurs.0,05"}
        - {header: "h = 0,25", path: "valeurs.0,25"}
        - {header: "h = 0,50", path: "valeurs.0,50"}
        - {header: Variation, path: variation_max_relative}
        - {header: Comparabilité, path: comparabilite}
    - section: contre_calcul
      title: Comparaison v1 (lot 47, conservée) aux valeurs du modèle source (C1 à C13) — contre-calcul d'un modèle non validé
      source: contre_calcul/comparaison.json
      rows: lignes
      columns:
        - {header: Point, path: point}
        - {header: Colonne, path: colonne}
        - {header: Code_Aster, path: code_aster}
        - {header: Source, path: source}
        - {header: Écart relatif, path: ecart_relatif}
