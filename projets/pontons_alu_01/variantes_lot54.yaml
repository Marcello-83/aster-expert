    description: "panne B (piles 1,30 à 3,90 m, Lpf 1,25 m), poutres principales 200 × 200 × 12, pannes 50 × 50 × 5, montants et diagonales 120 × 120 × 6 en treillis régulier (P64, P67), chevêtres 0,60 × 0,40 prolongés à ±1,20 (P68)"
    geometrie: B
    poutre: {cote: 200, epaisseur: 12}
    panne: {cote: 50, epaisseur: 5}
    montant: {cote: 120, epaisseur: 6}
  A54: {base: B54, geometrie: A, description: "panne A (piles 1,50 à 3,90 m, Lpf 1,05 m), poutres principales 200 × 200 × 12, pannes 50 × 50 × 5, montants et diagonales 120 × 120 × 6 en treillis régulier (P64, P67), chevêtres 0,60 × 0,40 prolongés à ±1,20 (P68)"}
