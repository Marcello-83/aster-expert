# Déclaration du projet PONTONS-ALU-01 (lots 50 à 51). Depuis le lot 51 : palée complète
# (4 piles, anneau BA), trois travées en aluminium soudé, appuis néoprène, variantes
# (variantes_lot51.yaml, PONTONS_VARIANTE). Les sections `deliverables`,
# `engineering_summary` et `results_package` décrivent encore la travée unique du lot 50
# bis (livrables et paquet versionné de ce lot) : le lot 51 n'emploie pas la chaîne des
# livrables, ses exports sont produits par scripts/lot51.py.
#
# Interface avec le tronc commun (schéma aster_expert.projet.declaration). Décisions P1 à
# P28 de MM (fiche) ; données : annexe « Données » de la consigne du lot 50. La géométrie
# est paramétrée dans maillage_pontons.py (script Salomé autonome, demande de MM) ; le
# .comm est généré à plat (repli accepté par MM : le tronc commun lit le .comm sans
# l'exécuter, boucles et variables y sont « dynamiques »). Chemins relatifs au projet.
schema_version: 1
name: pontons_alu_01
structure: PONTONS-ALU-01
description: >-
  Ponton (panne sur pieux) en aluminium soudé, lot 51 : trois travées (6,25 m, petite
  travée de 1,52 m, 6,25 m), poutres principales en tube carré 200 × 200 × 8, montants,
  diagonales, profilés supports et pannes tubulaires (POU_D_T, LIAISON_SOLIDE pour les
  excentricités) ; palée complète : 4 piles Ø 0,50, anneau BA de chevêtres et longrines
  0,40 × 0,40, semelle DKT sur sol élastique (RIGI_PARASOL) ; appuis néoprène (DIS_T) ;
  éclissages articulés ou continus ; cas élémentaires unitaires (G, Q, houle, températures,
  30 accostages, 16 amarrages) ; douze variantes de liaisons, de hauteur de pile,
  d'appuis et de section ; jeu B′ révisé et ELU accidentel. Lots 50 à 50 quinquies : une
  travée, références conservées.
fiche: fiche/hypotheses_pontons_alu_01.json
data: donnees/pontons_alu_01_model_data.yaml
data_sources: donnees/sources
results: resultats
knowledge_applied: connaissances_appliquees.yaml

mesh:
  # Lot 51 : palée complète et trois travées (maillage_palee.py) ; le fichier de
  # paramètres ne porte que H_PILES (variante courante, PONTONS_VARIANTE). Les invariants
  # versionnés sont ceux de la référence R (H = 1,32 m) ; ceux de H = 4,0 m sont écrits par
  # scripts/lot51.py. Lots 50 à 50 quinquies : maillage_pontons.py et invariants.yaml.
  script: maillage/maillage_palee.py
  parameters: pontons_alu_01.extensions_lot51:mesh_parameters
  invariants: maillage/invariants_palee.yaml

comm:
  generator: pontons_alu_01.extensions_lot51:generate
  output: resultats/pontons_alu_01.comm
  export:
    time_limit: 3600
    memory_limit: 6144
    mesh_unit: 20
    mesh_format: mmed

controls:
  threshold: 1.0e-6
  vertical: DZ
  output: equilibre.json
  # P35 : rotule côté quai Y > 0 fixe, rotule Y < 0 guidée (réaction DY nulle) ; pieds des
  # profilés supports en X = 14,02 encastrés sur un support fixe (APP_FIXE) ; ressorts de
  # sol sous la semelle (RIGI_PARASOL), efforts k·u lus aux nœuds. Les néoprènes et les
  # liaisons sont intérieurs au modèle : ils n'entrent pas dans le bilan.
  supports:
    - {group: APP_QUAI, blocked: [DX, DY, DZ], table: "RP_{case}"}
    - {group: APP_FIXE, blocked: [DX, DY, DZ], table: "RF_{case}"}
  springs:
    groups: [SOL]
    direction: [DX, DY, DZ]
    forces: pontons_alu_01.extensions_lot51:spring_forces
  cases:
    - {name: G1, expected_resultant: "pontons_alu_01.extensions_lot51:resultant"}
    - {name: G2, expected_resultant: "pontons_alu_01.extensions_lot51:resultant"}
    - {name: G2_T1, expected_resultant: "pontons_alu_01.extensions_lot51:resultant"}
    - {name: G2_PT, expected_resultant: "pontons_alu_01.extensions_lot51:resultant"}
    - {name: G2_T2, expected_resultant: "pontons_alu_01.extensions_lot51:resultant"}
    - {name: Q, expected_resultant: "pontons_alu_01.extensions_lot51:resultant"}
    - {name: Q_T1, expected_resultant: "pontons_alu_01.extensions_lot51:resultant"}
    - {name: Q_PT, expected_resultant: "pontons_alu_01.extensions_lot51:resultant"}
    - {name: Q_T2, expected_resultant: "pontons_alu_01.extensions_lot51:resultant"}
    - {name: QD, expected_resultant: "pontons_alu_01.extensions_lot51:resultant"}
