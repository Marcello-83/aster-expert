    - {name: G2_M3, expected_resultant: "pontons_alu_01.extensions_lot51ter:resultant"}
    - {name: G2_M4, expected_resultant: "pontons_alu_01.extensions_lot51ter:resultant"}
    - {name: G2_M5, expected_resultant: "pontons_alu_01.extensions_lot51ter:resultant"}
    - {name: Q, expected_resultant: "pontons_alu_01.extensions_lot51ter:resultant"}
    - {name: Q_M0, expected_resultant: "pontons_alu_01.extensions_lot51ter:resultant"}
