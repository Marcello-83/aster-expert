deliverables:
  # Lot 51 : seuls les champs de la variante R servent à la chaîne des livrables
  # (sous-étapes preparer à charges : charges.med et charges_salome.py, consigne § 5.3) ;
  # les exports du lot 51 sont écrits par scripts/lot51.py pour toutes les variantes.
  fields:
    - family: deplacements
      field: DEPL
      components: [DX, DY, DZ, DRX, DRY, DRZ]
      convention: "repère global : X le long du ponton depuis le quai, Y transversal, Z vertical vers le haut (cote NGF) ; m et rad"
    - family: efforts_poutres
      field: EFGE_ELNO
      groups: [POUTRES_PRINC, MONTANTS, DIAGONALES, PANNES_SEC, SUPPORTS, CHEVETRES, LONGRINES, PILES]
      components: [N, VY, VZ, MT, MFY, MFZ]
      convention: "POU_D_T, repère local de l'élément : x_l selon la maille ; barres horizontales z_l = +Z (VECT_Z) ; profilés supports et piles x_l = +Z, y_l = +X, z_l = +Y. N > 0 traction. Valeurs aux deux extrémités de chaque élément (ELNO)"
    - family: reactions
      field: REAC_NODA
      node_groups: [APP_QUAI, APP_FIXE]
      components: [DX, DY, DZ]
      convention: "repère global ; rotules du quai (P35) et pieds des profilés supports en X = 14,02 (support fixe)"
  not_relevant:
    - {item: contraintes_volumes, reason: "le modèle n'a aucun élément de volume (poutres POU_D_T, semelle DKT, ressorts DIS_T)"}
    - {item: efforts_coques, reason: "semelle non exploitée au lot 51 (consigne § 6 : barres, néoprènes, piles, réactions)"}
    - {item: ressorts, reason: "ressorts de sol cumulés dans reactions_elementaires.csv de scripts/lot51.py (−k·u aux nœuds de la semelle)"}
    - {item: combinaisons, reason: "lot 51 : 276 235 combinaisons par variante (5 416 185 pour E), données en règles et enveloppées par scripts/lot51.py (combinaisons_lot51), jamais énumérées par la chaîne des livrables"}
  load_plan_views: [Q, HU]
  static_results: {TP: TP, TM: TM, TAP: TAP, TAM: TAM}
  points:
    - {label: têtes des piles, node_group: TETES_PILES, cell_group: PILES}
    - {label: appuis côté quai, node_group: APP_QUAI, cell_group: POUTRES_PRINC}

# Synthèse ingénieur (lot 49 bis). Jeu B (PRO) par défaut ; le jeu A (S2) est produit
# par la même chaîne avec PONTONS_JEU=A (extensions.selected_set) : les états limites
# fréquent et quasi permanent, absents de S2, y sont ceux du jeu B.
engineering_summary:
  limit_states:
    - {state: ELU_fondamental, families: [A_ELU, B_ELU]}
    - {state: ELU_accidentel, families: [A_ELUA, B_ELUA]}
    - {state: ELS_caracteristique, families: [A_ELS_C, B_ELS_C]}
    - {state: ELS_frequent, families: [B_ELS_F]}
    - {state: ELS_quasi_permanent, families: [B_ELS_QP]}
  cracking: {state: ELS_quasi_permanent, source: "P23 de MM : fissuration du chevêtre à l'ELS quasi permanent (défaut de l'outil), à confirmer par MM"}
  no_service_criteria: "P14 de MM : les flèches sont rapportées sans critère ; aucun critère de service n'est vérifié dans ce lot."
  families:
    - {name: poutres principales, kind: poutre, field: EFGE_ELNO, groups: [POUTRES_PRINC], members: "PP_*", quantities: [N, VY, VZ, MT, MFY, MFZ], moments: [MFY, MFZ], shears: [VY, VZ], axis: X}
    - {name: montants, kind: poutre, field: EFGE_ELNO, groups: [MONTANTS], members: "MONT_*", quantities: [N, VY, VZ, MT, MFY, MFZ], moments: [MFY, MFZ], shears: [VY, VZ], axis: Y}
    - {name: diagonales, kind: poutre, field: EFGE_ELNO, groups: [DIAGONALES], members: "DIAG_*", quantities: [N, VY, VZ, MT, MFY, MFZ], moments: [MFY, MFZ], shears: [VY, VZ], axis: X}
    - {name: pannes secondaires, kind: poutre, field: EFGE_ELNO, groups: [PANNES_SEC], members: "PANNE_*", quantities: [N, VY, VZ, MT, MFY, MFZ], moments: [MFY, MFZ], shears: [VY, VZ], axis: X}
    - {name: profilés supports, kind: poutre, field: EFGE_ELNO, groups: [SUPPORTS], members: "SUP_*", quantities: [N, VY, VZ, MT, MFY, MFZ], moments: [MFY, MFZ], shears: [VY, VZ], axis: Z}
    - {name: chevêtre, kind: poutre, field: EFGE_ELNO, groups: [CHEVETRE], quantities: [N, VY, VZ, MT, MFY, MFZ], moments: [MFY, MFZ], shears: [VY, VZ], axis: Y}
    - {name: poteaux, kind: poutre, field: EFGE_ELNO, groups: [POTEAUX], members: "POT_*", quantities: [N, VY, VZ, MT, MFY, MFZ], circular: true, moments: [MFY, MFZ], shears: [VY, VZ], axis: Z}
    - {name: appuis côté quai, kind: appui, field: REAC_NODA, groups: [APP_QUAI], quantities: [DX, DY, DZ]}
    - {name: ressorts de sol, kind: discret, field: SIEF_ELGA, groups: [SOL], quantities: [N, VY, VZ]}
  sections:
    - name: poutres_principales
      label: poutres principales (toutes sections)
      family: poutres principales
      rule: {description: "toutes les extrémités d'éléments des deux poutres principales (PP_YM, PP_YP)"}
      justification: "Torseurs extrêmes et concomitants pour la vérification EC9 de MM (P15), lot ultérieur."
      not_exported: "aluminium vérifié à l'EC9 par MM, hors logiciel de béton armé (CSV propre au projet, sans en-tête béton)"
    - name: montants
      label: montants (toutes sections)
      family: montants
      rule: {description: "toutes les extrémités d'éléments des six montants"}
      justification: "Torseurs extrêmes et concomitants pour la vérification EC9 de MM (P15)."
      not_exported: "aluminium vérifié à l'EC9 par MM, hors logiciel de béton armé (CSV propre au projet, sans en-tête béton)"
    - name: diagonales
      label: diagonales (toutes sections)
      family: diagonales
      rule: {description: "toutes les extrémités d'éléments des cinq diagonales"}
      justification: "Torseurs extrêmes et concomitants pour la vérification EC9 de MM (P15)."
      not_exported: "aluminium vérifié à l'EC9 par MM, hors logiciel de béton armé (CSV propre au projet, sans en-tête béton)"
    - name: pannes_secondaires
      label: pannes secondaires (toutes sections)
      family: pannes secondaires
      rule: {description: "toutes les extrémités d'éléments des quatre pannes secondaires"}
      justification: "Torseurs extrêmes et concomitants pour la vérification EC9 de MM (P15)."
      not_exported: "aluminium vérifié à l'EC9 par MM, hors logiciel de béton armé (CSV propre au projet, sans en-tête béton)"
    - name: profiles_supports
      label: profilés supports (toutes sections)
      family: profilés supports
      rule: {description: "toutes les extrémités d'éléments des trois profilés supports"}
      justification: "Torseurs extrêmes et concomitants pour la vérification EC9 de MM (P15) ; section supposée (P17)."
      not_exported: "aluminium vérifié à l'EC9 par MM, hors logiciel de béton armé (CSV propre au projet, sans en-tête béton)"
    - name: chevetre_supports
      label: chevêtre au droit des profilés supports
      family: chevêtre
      moment_signs: {MFY: both, MFZ: both}
      rule: {description: "extrémités d'éléments du chevêtre aux nœuds des profilés supports, Y = −0,93 ; 0 ; +0,93 (P24)", station: {axis: Y, values: [-0.93, 0.0, 0.93]}}
      justification: "Charges concentrées des profilés supports, articulés sur le chevêtre (P18) ; depuis P24, les supports de rive (±0,93) sont en console au-delà des poteaux (±0,75)."
      shared_rows: [chevetre_mi_portee]
      bending_export: &chevetre
        section_type: "rectangulaire 0,25 (X) × 0,40 (Z), béton armé neuf (P3, P16)"
        h: {value: 0.40, unit: m, source: "P3 : hauteur 0,40 m"}
        b: {value: 0.25, unit: m, source: "P3 : largeur 0,25 m en X, à affiner"}
        ds: {value: 0.07, unit: m, source: "P23 et consigne du lot 50 : ds = 0,07 m, à confirmer par MM"}
        di: {value: 0.07, unit: m, source: "P23 et consigne du lot 50 : di = 0,07 m, à confirmer par MM"}
        concrete: {value: C35/45, source: "P20"}
        steel: {value: "non donné par l'annexe « Données » (à fournir par MM)", source: "consigne du lot 50, étape 4 : nuance d'acier absente"}
        exposure: {value: XS3, source: "consigne du lot 50, étape 4"}
        cnom: {value: 55, unit: mm, source: "consigne du lot 50, étape 4"}
        planes:
          - {moment: MFY, top_fibre: "+z_l", label: "flexion verticale (z_l = +Z, fibre supérieure en haut)"}
          - {moment: MFZ, top_fibre: "+y_l", rotated: true, label: "flexion horizontale (y_l = −X), section tournée : h = 0,25, b = 0,40"}
    - name: chevetre_nu_poteaux
      label: chevêtre au nu des poteaux
      family: chevêtre
      moment_signs: {MFY: both, MFZ: both}
      rule: {description: "extrémités d'éléments du chevêtre aux nus des poteaux Ø 0,50 d'axe Y = ±0,75 : |Y| = 0,50 et 1,00 (chevêtre jusqu'à ±1,05 depuis P24)", station: {axis: Y, values: [0.5, 1.0], absolute: true}}
      justification: "Section sur appui lue au nu des poteaux (consigne du lot 50, étape 4) ; aucun moment d'encastrement réduit (règle E27 propre à l'estacade, non décidée ici)."
      bending_export: *chevetre
    - name: chevetre_mi_portee
      label: chevêtre à mi-portée entre les poteaux
      family: chevêtre
      moment_signs: {MFY: both, MFZ: both}
      rule: {description: "extrémités d'éléments du chevêtre à Y = 0 (mi-portée entre les poteaux, aussi profilé support central)", station: {axis: Y, value: 0.0}}
      justification: "Moment de travée du chevêtre entre les poteaux (consigne du lot 50, étape 4)."
      shared_rows: [chevetre_supports]
      bending_export: *chevetre
    - name: tetes_poteaux
      label: têtes des poteaux (+0,69)
      family: poteaux
      rule: {description: "extrémités d'éléments de poteau au nœud de tête (TETES_POTEAUX, +0,69 NGF, dessous du chevêtre)", node_group: TETES_POTEAUX}
      justification: "Efforts en tête des poteaux, pour la vérification ultérieure des poteaux existants (P16)."
      not_exported: "poteaux existants non vérifiés dans ce lot (P16) ; efforts rapportés seulement"
    - name: pieds_poteaux
      label: pieds des poteaux (−0,63)
      family: poteaux
      rule: {description: "extrémités d'éléments de poteau au pied, Z = −0,63 NGF (dessus de la semelle)", box: {z: [-0.63, -0.63]}}
      justification: "Efforts transmis à la semelle par les poteaux (réactions aux pieds des poteaux, consigne du lot 50, étape 4)."
      not_exported: "poteaux existants non vérifiés dans ce lot (P16) ; efforts rapportés seulement"
    - name: appuis_quai
      label: rotules côté quai
      family: appuis côté quai
      rule: {description: "nœuds des rotules côté quai (APP_QUAI, P25 : Y > 0 fixe, Y < 0 guidée)", node_group: APP_QUAI}
      justification: "Réactions des rotules côté quai, pour l'assemblage boulonné entre travées."
      not_exported: "réaction d'appui, sans section de béton armé"
    - name: sol
      label: ressorts de sol
      family: ressorts de sol
      rule: {description: "tous les ressorts de la semelle (SOL)"}
      justification: "Pression du sol sous la semelle (k·u par surface tributaire), pour information."
      not_exported: "efforts de ressorts de sol, sans section de béton armé"

