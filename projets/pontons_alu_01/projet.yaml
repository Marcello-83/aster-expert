# Déclaration du projet PONTONS-ALU-01 (lots 50 à 51 ter). Depuis le lot 51 ter : ponton
# intégral (culée, cinq palées, cinq grandes travées, porte-à-faux d'extrémité), cotes de
# l'AVP, appuis articulés à axe, houle par surfaces, variantes (variantes_lot51ter.yaml,
# PONTONS_VARIANTE ; lots 51 et 51 bis : variantes_lot51.yaml et variantes_lot51bis.yaml,
# références sous references/execution_lot51 et references/execution_lot51bis). Les
# sections `engineering_summary` et `results_package` décrivent encore la travée unique du
# lot 50 bis (paquet versionné de ce lot) : les lots 51 à 51 ter n'emploient de la chaîne
# des livrables que la production de charges.med ; leurs exports sont produits par
# scripts/lot51ter.py.
#
# Interface avec le tronc commun (schéma aster_expert.projet.declaration). Décisions P1 à
# P28 de MM (fiche) ; données : annexe « Données » de la consigne du lot 50. La géométrie
# est paramétrée dans maillage_pontons.py (script Salomé autonome, demande de MM) ; le
# .comm est généré à plat (repli accepté par MM : le tronc commun lit le .comm sans
# l'exécuter, boucles et variables y sont « dynamiques »). Chemins relatifs au projet.
schema_version: 1
name: pontons_alu_01
structure: PONTONS-ALU-01
description: >-
  Ponton (panne sur pieux) en aluminium soudé, lot 51 ter : ponton intégral, culée en
  X = 0 (seul point fixe longitudinal), cinq palées (petites travées de 1,52 m), cinq
  grandes travées de 6,25 m et porte-à-faux d'extrémité ; cotes de l'AVP (dessus +1,40
  NGF) ; poutres principales en tube carré 200 × 200 × 10 (ou × 12), montants, diagonales,
  pannes et panne de rive tubulaires (POU_D_T, LIAISON_SOLIDE pour les excentricités) ;
  appuis articulés à axe sur les deux chevêtres de chaque palée (LIAISON_DDL, X libre, Y
  bloqué d'un côté) ; palées : 4 piles Ø 0,50 encastrées, anneau BA 0,40 × 0,40, semelle
  DKT 2,60 × 2,60 × 0,20 m sur sol élastique (RIGI_PARASOL), déjaugeage du béton ; cas
  élémentaires unitaires (G, DEJ, G2, Q, QD et quatre cas de houle par modules, 126
  accostages, 40 amarrages, températures) ; quatre variantes (géométrie des pannes A et
  B, sections) ; jeu B′ révisé et ELU accidentel. Lots 50 à 51 bis : références conservées.
fiche: fiche/hypotheses_pontons_alu_01.json
data: donnees/pontons_alu_01_model_data.yaml
data_sources: donnees/sources
results: resultats
knowledge_applied: connaissances_appliquees.yaml

mesh:
  # Lot 51 ter : ponton intégral (maillage_ponton_51ter.py) ; le fichier de paramètres porte
  # les stations, les hauteurs de piles, le porte-à-faux et la cote des pannes (variante
  # courante, PONTONS_VARIANTE). Les invariants versionnés sont ceux de la référence B10 ;
  # ceux des autres variantes sont écrits par scripts/lot51ter.py. Lot 51 bis :
  # maillage_palee_51bis.py et invariants_palee_51bis.yaml.
  script: maillage/maillage_ponton_51ter.py
  parameters: pontons_alu_01.extensions_lot51ter:mesh_parameters
  invariants: maillage/invariants_ponton_51ter.yaml

comm:
  generator: pontons_alu_01.extensions_lot51ter:generate
  output: resultats/pontons_alu_01.comm
  export:
    time_limit: 3600
    memory_limit: 6144
    mesh_unit: 20
    mesh_format: mmed

controls:
  threshold: 1.0e-6
  vertical: DZ
  output: equilibre.json
  # Lot 51 ter, correction du tronc commun (harnais version 3) : un cas thermique sans
  # effort (TP, TM : X libre aux palées, dilatation libre depuis la culée) a une échelle
  # de bruit numérique ; il est jugé sur le critère absolu Σ|F| ≤ 1 N.
  absolute_threshold_n: 1.0
  # P58 : culée en X = 0, axe YP bloqué en X, Y, Z, axe YM bloqué en X, Z (réaction DY
  # nulle), seul point fixe longitudinal ; ressorts de sol sous les cinq semelles
  # (RIGI_PARASOL), efforts k·u lus aux nœuds. Les appuis à axe sont intérieurs au
  # modèle : ils n'entrent pas dans le bilan. Liste des cas écrite par
  # generation_lot51ter.all_cases (test : égalité).
  supports:
    - {group: APP_CULEE, blocked: [DX, DY, DZ], table: "R{case}"}
  springs:
    groups: [SOL]
    direction: [DX, DY, DZ]
    forces: pontons_alu_01.extensions_lot51ter:spring_forces
  cases:
    - {name: G1, expected_resultant: "pontons_alu_01.extensions_lot51ter:resultant"}
    - {name: DEJ, expected_resultant: "pontons_alu_01.extensions_lot51ter:resultant"}
    - {name: G2, expected_resultant: "pontons_alu_01.extensions_lot51ter:resultant"}
    - {name: G2_M0, expected_resultant: "pontons_alu_01.extensions_lot51ter:resultant"}
