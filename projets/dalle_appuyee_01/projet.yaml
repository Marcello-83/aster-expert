# Déclaration du projet DALLE-APPUYEE-01 : dalle appuyée sur quatre côtés (lot 43).
#
# Interface avec le tronc commun (schéma aster_expert.projet.declaration). Elle
# déclare, sans rien calculer : fiche arbitrée et données, maillage (script Salomé,
# invariants du maillage le plus fin de la suite de convergence), générateur,
# contrôles de niveau D (réactions, pesanteur, symétrie selon X et Y), combinaisons
# (règles EN 1990 lues des données) et plaque à ferrailler en 2D. Chemins relatifs
# au répertoire du projet.
schema_version: 1
name: dalle_appuyee_01
structure: DALLE-APPUYEE-01
description: >-
  Dalle en béton armé C30/37 de 6,00 m x 4,00 m x 0,30 m, simplement appuyée sur
  ses quatre côtés (appui bilatéral), DKT, élasticité linéaire non fissurée ; poids
  propre et exploitation de 10 kPa ; comparaison à Navier (niveau E) et
  ferraillage 2D.
fiche: fiche/hypotheses_dalle_arbitree.json
data: donnees/dalle_model_data.yaml
data_sources: donnees/sources
results: resultats
knowledge_applied: connaissances_appliquees.yaml

mesh:
  script: maillage/dalle_mesh.py
  parameters: dalle_appuyee_01.extensions:mesh_parameters
  invariants: maillage/invariants_h0p125.yaml

comm:
  generator: dalle_appuyee_01.extensions:generate
  output: resultats/dalle.comm
  export:
    time_limit: 900
    memory_limit: 4096
    mesh_unit: 20
    mesh_format: mmed
  required_data:
    - geometrie.longueur
    - geometrie.largeur
    - geometrie.epaisseur
    - beton.module_young
    - beton.coefficient_poisson
    - beton.poids_volumique
    - charges.acceleration_pesanteur
    - charges.exploitation_uniforme
    - charges.resultante_poids_propre_attendue
    - charges.resultante_exploitation_attendue
    - maillage.tailles_convergence

controls:
  threshold: 1.0e-6
  vertical: DZ
  output: equilibre.json
  total_reactions: {label: TOUS, table: "REAC_TOUS_{case}"}
  # Seules les composantes réellement bloquées entrent dans l'équilibre (CA-036) ;
  # P_A et P_B appartiennent aussi à APPUIS, mais pour DZ seulement.
  supports:
    - {group: APPUIS, blocked: [DZ], table: "REAC_APPUIS_{case}"}
    - {group: P_A, blocked: [DX, DY], table: "REAC_PA_{case}"}
    - {group: P_B, blocked: [DY], table: "REAC_PB_{case}"}
  cases:
    - {name: G, gravity: true, expected_resultant: "dalle_appuyee_01.extensions:resultant"}
    - {name: Q, expected_resultant: "dalle_appuyee_01.extensions:resultant"}
  # Point 6 (P4) : dalle entière, la symétrie est un contrôle, pas une hypothèse.
  symmetry_planes:
    - {normal: X, position: 3.0, table: "SYMETRIE_{case}", cases: [G, Q]}
    - {normal: Y, position: 2.0, table: "SYMETRIE_{case}", cases: [G, Q]}
  # Lot 46 : niveau E visé, donc convergence de maillage (CTL-012) : erreurs au centre
  # de la suite h0p500, h0p250, h0p125 contre Navier.
  convergence:
    series: dalle_appuyee_01.extensions:convergence_series

# Point 13 (P5) : catégorie E, G toujours défavorable (aucun γG favorable).
combinations:
  permanent: [G]
  gamma_g_unfavourable: {data: combinaisons.gamma_g_defavorable}
  gamma_q: {data: combinaisons.gamma_q}
  variables:
    - {name: Q, psi0: {data: combinaisons.q_psi0}, psi1: {data: combinaisons.q_psi1}, psi2: {data: combinaisons.q_psi2}}

# Point 14 (P6 et complément ELS) : ferraillage 2D par le tronc commun.
rebar:
  plates:
    - group: DALLE
      label: dalle appuyée
      thickness_m: {data: geometrie.epaisseur}
      cover_mm: {data: durabilite.distance_parement_axe_armatures}
      fck_mpa: {data: beton.fck}
      fyk_mpa: {data: acier.fyk}
      fctm_mpa: {data: beton.fctm}
      eys_mpa: {data: acier.module_young}
      alpha_cc: {data: acier.alpha_cc}
      sigma_s_ratio: {data: acier.rapport_sigma_s_els}
      sigma_c_els_mpa: {data: acier.sigma_c_els}
      sigma_c_els_qp_mpa: {data: acier.sigma_c_els_qp}
      alpha_e: {data: acier.alpha_e}
      kt: {data: acier.kt}
      wk_mm: {data: durabilite.ouverture_fissure_limite}
      phi_mm: {data: acier.diametre_barres}
      families:
        - {family: ELU fondamentale, type_comb: ELU, gamma_c: 1.5, gamma_s: 1.15}
        - {family: ELS caractéristique, type_comb: ELS}
        - {family: ELS quasi permanente, type_comb: ELS_QP}
      check_node: CENTRE

# Paquet de résultats versionnable (lot 45, `aster-expert projet exporter-resultats
# dalle_appuyee_01`) : ce que les notes de résultats peuvent lire, sans MED. Les
# comptes rendus d'exécution, le rapport de `mesh check` et la validation B y
# sont ajoutés d'office ; les sections présentes décident des sections des notes.
# Lot 49 : livrables de résultats (aster-expert projet dalle_appuyee_01 livrables). RC01 à
# RC04 et RSENS sont des résolutions du .comm qui ne sont pas des cas élémentaires.
deliverables:
  fields:
    - family: deplacements
      field: DEPL
      components: [DX, DY, DZ, DRX, DRY, DRZ]
      convention: "repère global (point 9) : X et Y dans le plan de la dalle, Z vers le haut"
    - family: efforts_coques
      field: EFGE_NOEU
      groups: [DALLE]
      components: [NXX, NYY, NXY, MXX, MYY, MXY, QX, QY]
      convention: "dalle DKT, repère local x_l = X, y_l = Y (ANGL_REP = (0, 0)), normales +Z ; MXX > 0 tend la face supérieure (CA-045) ; efforts par unité de largeur"
    - family: reactions
      field: REAC_NODA
      node_groups: [APPUIS, P_A, P_B]
      components: [DX, DY, DZ]
      convention: "repère global ; appui simple DZ = 0 sur APPUIS, blocage isostatique DX = DY = 0 en P_A, DY = 0 en P_B (point 6)"
  not_relevant:
    - {item: efforts_poutres, reason: "le modèle n'a aucun élément de poutre (dalle DKT seule)"}
    - {item: contraintes_volumes, reason: "le modèle n'a aucun élément de volume (dalle DKT seule)"}
    - {item: ressorts, reason: "le modèle n'a aucun ressort (appui simple par DDL_IMPO, point 6)"}
  combinations: declarees
  ignored_results:
    - {result: RC01, reason: "combinaison ELU déjà calculée par Code_Aster pour le ferraillage, recalculée par les livrables à partir des cas"}
    - {result: RC02, reason: "combinaison ELS caractéristique déjà calculée par Code_Aster pour le ferraillage, recalculée par les livrables"}
    - {result: RC03, reason: "combinaison ELS fréquente déjà calculée par Code_Aster pour le ferraillage, recalculée par les livrables"}
    - {result: RC04, reason: "combinaison ELS quasi permanente déjà calculée par Code_Aster pour le ferraillage, recalculée par les livrables"}
    - {result: RSENS, reason: "résolution de sensibilité du ferraillage, qui n'est pas un cas de charge de l'ouvrage"}
  points:
    - {label: centre de la dalle, node_group: CENTRE}

# Lot 49 bis : synthèse ingénieur (aster_expert.livrables.ingenieur). Dalle appuyée sur
# quatre côtés : familles « dalle » et « appuis », états limites des familles de
# combinaisons EN 1990 de la section `combinations`, en-tête des fichiers de flexion
# composée lu dans les données (points 5 et 14 de la fiche).
engineering_summary:
  limit_states:
    - {state: ELU_fondamental, families: [ELU fondamentale]}
    - {state: ELS_caracteristique, families: [ELS caractéristique]}
    - {state: ELS_frequent, families: [ELS fréquente]}
    - {state: ELS_quasi_permanent, families: [ELS quasi permanente]}
  absent_limit_states:
    - {state: ELU_accidentel, reason: "aucune action accidentelle n'est déclarée pour la dalle (cas G et Q seuls)"}
  cracking: {state: ELS_quasi_permanent, source: "données durabilite.ouverture_fissure_limite : wk = 0,4 mm sous combinaison quasi permanente (point 14)"}
  families:
    - name: dalle
      kind: coque
      field: EFGE_NOEU
      groups: [DALLE]
      quantities: [NXX, NYY, NXY, MXX, MYY, MXY, QX, QY]
    - name: appuis
      kind: appui
      field: REAC_NODA
      groups: [APPUIS]
      quantities: [DZ]
  sections:
    - name: dalle_travee
      label: dalle, toute la travée
      family: dalle
      rule: {description: "tous les nœuds de la dalle (appui simple sur les quatre côtés, aucun appui ponctuel ni nœud partagé)"}
      justification: "Dalle portant dans les deux directions : les moments de dimensionnement sont ceux de la travée, lus sur toute la dalle."
      bending_export: &dalle
        section_type: "rectangulaire, bande de 1,00 m"
        h: {data: geometrie.epaisseur, source: "fiche, données de MM"}
        b: {value: 1.00, unit: m, source: "efforts par mètre de largeur"}
        ds: {data: durabilite.distance_parement_axe_armatures, source: "point 14 (C_SUP = C_INF de CALC_FERRAILLAGE)"}
        di: {data: durabilite.distance_parement_axe_armatures, source: "point 14 (C_SUP = C_INF de CALC_FERRAILLAGE)"}
        concrete: {data: beton.classe, source: "données de MM"}
        steel: {data: acier.nuance, source: "point 14"}
        exposure: {data: durabilite.classe_exposition, source: "données de MM"}
        cnom: {data: durabilite.enrobage, source: "point 14 (P6)"}
        per_metre: true
        planes:
          - {moment: MXX, top_fibre: "+n", label: "flexion selon X (grande portée), normale +Z"}
          - {moment: MYY, top_fibre: "+n", label: "flexion selon Y (petite portée), normale +Z"}
    - name: dalle_centre
      label: centre de la dalle
      family: dalle
      rule: {description: "nœud du centre de la dalle (CENTRE, X = 3,00, Y = 2,00)", node_group: CENTRE}
      justification: "Point de contrôle du ferraillage (check_node) et de la comparaison à Navier (niveau E, lot 43)."
      # Lot 49 ter (D3) : le centre est un point de contrôle pris dans la travée, partage déclaré.
      shared_rows: [dalle_travee]
      bending_export: *dalle
    - name: appuis
      label: appuis simples
      family: appuis
      rule: {description: "nœuds des quatre côtés appuyés (APPUIS, DZ = 0)", node_group: APPUIS}
      justification: "Réaction verticale linéique des appuis, à reporter sur les porteurs."
      not_exported: "réaction d'appui, sans section de béton armé"
  no_service_criteria: "aucun critère de service n'a été décidé par MM pour la dalle (fiche, points 1 à 14) ; les déplacements restent lisibles dans les livrables"
  cuts:
    - {name: dalle_y2, family: dalle, axis: Y, value: 2.0, along: X, components: [MXX, MYY]}
    - {name: dalle_x3, family: dalle, axis: X, value: 3.0, along: Y, components: [MXX, MYY]}

results_package:
  items:
    # Lot 49 : livrables (manifeste des MED et VTU, contrôle des charges, synthèses,
    # images) ; les MED et VTU eux-mêmes ne sont jamais versionnés.
    - {section: visualisation, source: "resultats/livrables/paquet/*.json"}
    - {section: visualisation, source: resultats/livrables/paquet/synthese.csv}
    - {section: visualisation, source: "resultats/livrables/png/charges_*_iso.png", required: false}
    - {section: visualisation, source: "resultats/livrables/png/resultats_ENV_*_iso.png", required: false}
    # Lot 49 bis : fichiers de flexion composée et diagrammes de la synthèse ingénieur.
    - {section: visualisation, source: "resultats/livrables/paquet/flexion_composee/*.csv", subdirectory: flexion_composee}
    - {section: visualisation, source: "resultats/livrables/paquet/diagrammes/*.png", subdirectory: diagrammes}
    - {section: controles, source: resultats/controles/controles_d.json}
    - {section: controles, source: resultats/controles/equilibre.json}
    - {section: niveau_e, source: references/niveau_e_lot43.json}
    - {section: niveau_e, source: references/rejeu_niveau_e_lot45.json}
    - {section: niveau_e, source: references/navier_lot43.json}
    - {section: ferraillage, source: "resultats/ferraillage/ferraillage_*.json"}
    - {section: ferraillage, source: references/recalcul_es_lot44.json}
  # Critères de niveau D et E écrits avant l'exécution (lot 43, étape 2a).
  criteria:
    - {level: D, document: docs/essais_lot43.md}
    - {level: E, document: docs/essais_lot43.md}
  # Niveau E : comparaison à Navier sur la suite de convergence. Le niveau obtenu au
  # lot 43 (`niveau_e_lot43.json`, EYS = 210 GPa) ne se reporte pas sur le `.comm`
  # actuel (EYS = 200 GPa, règle de conservation) : critères rejoués au lot 45 sur les
  # maillages versionnés, avec les critères d'origine (`rejeu_niveau_e_lot45.json`).
  # Le `.comm` du maillage le plus fin du rejeu est confronté à celui de l'exécution.
  level_e:
    results: references/rejeu_niveau_e_lot45.json
    criteria_ids: [E0, E1, E2]
    comm: references/rejeu_lot45/dalle_h0p125.comm
  # Tableaux de la note de résultats (lot 45) : lus dans les fichiers du paquet.
  note_tables:
    - section: cas
      title: Cas G, suite de convergence — comparaison à la solution de Navier au centre
      source: niveau_e/rejeu_niveau_e_lot45.json
      rows: series
      columns:
        - {header: "Taille de maille (m)", path: taille_m, unit: "m"}
        - {header: Mailles, path: mailles}
        - {header: "Flèche w (m)", path: cas.G.w}
        - {header: "Erreur relative de w", path: cas.G.erreurs.w}
        - {header: "Mx (N·m/m)", path: cas.G.mx, unit: "N·m/m"}
        - {header: "Erreur relative de Mx", path: cas.G.erreurs.mx}
        - {header: "My (N·m/m)", path: cas.G.my, unit: "N·m/m"}
        - {header: "Erreur relative de My", path: cas.G.erreurs.my}
    - section: cas
      title: Cas Q, suite de convergence — comparaison à la solution de Navier au centre
      source: niveau_e/rejeu_niveau_e_lot45.json
      rows: series
      columns:
        - {header: "Taille de maille (m)", path: taille_m, unit: "m"}
        - {header: Mailles, path: mailles}
        - {header: "Flèche w (m)", path: cas.Q.w}
        - {header: "Erreur relative de w", path: cas.Q.erreurs.w}
        - {header: "Mx (N·m/m)", path: cas.Q.mx, unit: "N·m/m"}
        - {header: "Erreur relative de Mx", path: cas.Q.erreurs.mx}
        - {header: "My (N·m/m)", path: cas.Q.my, unit: "N·m/m"}
        - {header: "Erreur relative de My", path: cas.Q.erreurs.my}
    - section: cas
      title: Solution de Navier de référence, par cas
      source: niveau_e/navier_lot43.json
      rows: cas
      key_header: Cas
      columns:
        - {header: Cas, path: "$key"}
        - {header: "Charge q (Pa)", path: q_pa, unit: "Pa"}
        - {header: "Flèche w (m)", path: w_m}
        - {header: "Mx (N·m/m)", path: mx_nm_par_m, unit: "N·m/m"}
        - {header: "My (N·m/m)", path: my_nm_par_m, unit: "N·m/m"}
        - {header: "Termes de la série", path: termes_m_n}
    - section: cas
      title: Équilibre par composante, par cas (N)
      source: controles/equilibre.json
      rows: cases.*.components
      columns:
        - {header: Cas, path: "^$key"}
        - {header: Composante, path: "$key"}
        - {header: "Charge appliquée", path: applied_as_evaluated_n, unit: "N"}
        - {header: "Réactions bloquées", path: reactions_blocked_n, unit: "N"}
        - {header: Bilan, path: balance_n, unit: "N"}
        - {header: "Écart relatif", path: relative_gap}
    - section: cas
      title: Réactions d'appui par groupe, par cas (N)
      source: controles/equilibre.json
      rows: cases.*.reactions_by_group_n
      columns:
        - {header: Cas, path: "^$key"}
        - {header: Groupe, path: "$key"}
        - {header: DX, path: DX, unit: "N"}
        - {header: DY, path: DY, unit: "N"}
        - {header: DZ, path: DZ, unit: "N"}
