# Données chiffrées du modèle DALLE-APPUYEE-01 (lot 43).
#
# Schéma : aster_expert.agent.model_data (Pydantic). Chaque valeur porte sa valeur,
# son unité et sa source, recopiée dans l'unité de la source (m, mm, kPa) : aucune
# conversion ni déduction ici. La seule source avant arbitrage est la description
# de MM (sources/description_MM_lot43.md). Toute valeur qu'elle ne donne pas reste
# `a_fournir`, avec le point de la fiche qui la demande : elle bloque la génération
# (HypothesesSheet.generation_blockers). Aucune valeur « usuelle » n'est complétée
# par la session (lot 43 : aucune décision pratique à la place de MM).
project: DALLE-APPUYEE-01
