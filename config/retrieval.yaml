# Paramètres de recherche.
#
# Aucun index vectoriel n'est activé tant que le banc d'évaluation n'a pas
# montré un déficit de rappel du moteur lexical (ADR-004).

schema_version: 1

engines:
  lexical:
    enabled: true
    backend: bm25
    k1: 1.2
    b: 0.75
  vector:
    enabled: false
    backend: null
    model: null
    dimension: null

fusion:
  enabled: false
  method: null

reranking:
  enabled: false
  backend: null

defaults:
  top_k: 15
  # Priorité appliquée à score équivalent, conformément à CLAUDE.md.
  source_priority:
    syntax: [catalogue, U4, U7, testcase, source]
    theory: [R, U2, U4, V]
    example: [testcase, V, U4]

filters:
  # Champs sur lesquels un filtre strict est possible.
  allowed: [version, family, document_id, command, keyword, behaviour,
            modelisation, testcase, domain]

output:
  show_scores: true
  show_source_path: true
  show_commit: true
  max_excerpt_chars: 1200
