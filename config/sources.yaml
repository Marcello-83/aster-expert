# Sources externes du corpus Code_Aster.
#
# Ces dépôts sont clonés sous external/ et ne sont jamais commités.
# Les chemins internes (families.paths) sont volontairement vides : ils doivent
# être établis par inspection lors du lot d'inventaire, jamais supposés.

schema_version: 1

defaults:
  clone_root: external
  # Politique de mise à jour : fetch_only | fetch_and_checkout | pinned
  # fetch_only        : récupère les révisions, ne modifie pas la copie de travail
  # fetch_and_checkout: positionne la copie de travail sur `ref`
  # pinned            : n'agit que si le commit local diffère de `commit`
  update_policy: fetch_and_checkout
  # Une copie de travail modifiée bloque la synchronisation de sa source.
  allow_dirty: false
  # Clone partiel : accélère fortement le premier clone de dépôts volumineux.
  partial_clone: true
  depth: null

sources:
  - name: codeaster-src
    url: https://gitlab.com/codeaster/src.git
    # Tag correspondant à la version de l'image simvia/code_aster utilisée
    # (17.4.0, digest sha256:d8d19ea9... résolu en lot 2). Ne jamais repasser
    # à `main` : le clone personnel de l'utilisateur sous ~/code-aster est sur
    # `main` et n'a jamais servi de corpus pour cette raison précise.
    ref: "17.4.0"
    # Commit *peelé* (celui réellement extrait par `git checkout 17.4.0`),
    # pas le sha de l'objet tag annoté lui-même. Corrigé au lot 3 : la valeur
    # précédente (961aacdfe6d316a88708143c02523dc3dd443432) était le sha de
    # l'objet tag annoté ("tag" pour `git cat-file -t`, vérifié en session),
    # qui se "peele" vers ce commit (`git rev-parse 17.4.0^{commit}`) — la
    # copie de travail n'a jamais divergé, seule la valeur déclarée ici
    # désignait le mauvais objet. `aster-expert sources sync` compare
    # toujours des commits peelés (aster_expert.ingestion.git_client).
    commit: 50ebc13c70ee9df62faf93ddcb746a3757b3042a
    local_path: external/codeaster-src
    license: GPL-3.0
    families:
      catalogue:
        enabled: true
        paths: []
      testcases:
        enabled: true
        paths: []
      devguide:
        enabled: false
        paths: []
    update_policy: fetch_and_checkout

  - name: codeaster-doc
    url: https://gitlab.com/codeaster/doc/docaster.git
    # Correspondance établie au lot 3, pas devinée par similarité de
    # numérotation : `git ls-remote --tags` sur ce dépôt (aucun clone,
    # aucun objet téléchargé) liste 17.0, 17.2.0, 17.3.0, 17.4.0, 18.1.0,
    # smeca2024.0 — un tag nommé très exactement "17.4.0" existe, dans le
    # même dépôt GitLab `codeaster` que `codeaster-src`, qui tague lui aussi
    # ses versions "17.4.0", "17.3.0", etc. Deux dépôts de la même
    # organisation partageant littéralement le même nom de tag pour ce qui
    # est, de part et d'autre, une sortie de version numérotée à l'identique
    # est une correspondance déclarée et vérifiable, pas une inférence sur
    # la forme du nom. Détail complet, y compris l'inspection du contenu du
    # tag (structure, absence de rendu construit), dans le compte rendu du
    # lot 3. À réviser si un changelog docaster contredit un jour cette
    # correspondance.
    ref: "17.4.0"
    commit: 9c8c179f57ef7ca1d2891cac275ee4823a57967c
    local_path: external/codeaster-doc
    license: GFDL-1.3
    families:
      manuals:
        enabled: true
        # Établi par inspection au lot 6 (docs/development-plan.md, lot 6 ;
        # observation de clôture du lot 3) : le contenu documentaire vit
        # sous `source/manuals/`, subdivisé par famille (`man_u`, `man_r`,
        # `man_v`, `man_d`, et `man_s` — cette dernière non anticipée par
        # docs/corpus.md §3, amendée au lot 6). Un document est un
        # répertoire portant son propre `index.rst`, jamais imbriqué sous un
        # autre document (0 occurrence vérifiée sur 2047 documents).
        paths: ["source/manuals"]
    update_policy: fetch_and_checkout

# Sources secondaires, non indexées, citables uniquement avec mention
# explicite de leur statut.
secondary_sources:
  - name: forum
    url: https://code-aster.org/forum2/
    indexed: false
    note: source communautaire, jamais opposable au catalogue
