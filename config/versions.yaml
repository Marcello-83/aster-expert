# Versions Code_Aster.
#
# Code_Aster n'est pas installé nativement : il s'exécute dans une image
# Docker gérée par `cave` (voir docs/architecture.md, ADR-002, ADR-003,
# ADR-006). La section `detected` est écrite par `aster-expert env detect` à
# partir de l'image réellement utilisée. Elle n'est jamais remplie à la main.
# Tant que `target` est nul, aucune commande produisant ou validant de la
# syntaxe ne doit s'exécuter.
#
# Le tag `stable` n'est jamais une valeur valide de `target` ni de
# `detected.image.tag` : il est mobile côté registre Docker Hub et peut
# diverger de l'image locale du même nom (divergence constatée en session :
# `stable` en local pointait vers 16.8.0 alors que Docker Hub annonçait
# 17.4.0 comme version stable). La version cible est toujours résolue par
# digest, jamais par tag seul.

schema_version: 2

# Version cible utilisée par défaut lorsqu'une requête n'en précise pas.
# Numéro de version exact (ex. "17.4.0"), jamais "stable" ni "testing".
target: null

# Écrit par `aster-expert env detect`. Ne pas éditer.
detected:
  detected_at: '2026-09-15T09:38:32.530596Z'
  install_kind: container_docker
  container:
    engine: docker
    engine_version_raw: Docker version 29.1.3, build 29.1.3-0ubuntu3~24.04.2
    image_repository: simvia/code_aster
    image_tag: 17.4.0
    image_digest: sha256:d8d19ea91989eac0d38195bc5795c54c69f530f7196f53d67697ffa57c9106d5
    image_id: sha256:6a66bdaf0942869feb9224ce8ec01e1023bb13e5f403c87f79914aa9873bd598
    cave_pin_source: global
  run_aster:
    path_in_container: /opt/spack/opt/spack/linux-zen2/code-aster-17.4.0-ecm2bfgr5obydotnlte6xilvggppqnap/bin/run_aster
    version_raw: code_aster 17.4.0 (spack-local)
  aster_python:
    interpreter_path_in_container: /opt/spack/opt/spack/linux-zen2/python-3.11.14-crxgllx4ijrk74sukxvebk3ulzuavesl/bin/python3
    pythonpath_extra:
    - /opt/spack/var/spack/environments/simvia_env/.spack-env/view/lib/python3.11/site-packages
  code_aster_package:
    path_in_container: /opt/spack/opt/spack/linux-zen2/code-aster-17.4.0-ecm2bfgr5obydotnlte6xilvggppqnap/lib64/aster/code_aster
  catalogue:
    path_in_container: /opt/spack/opt/spack/linux-zen2/code-aster-17.4.0-ecm2bfgr5obydotnlte6xilvggppqnap/lib64/aster/code_aster/Cata
    fingerprint_sha256: b59726e0e698b1b477dc138028defff9c92168ad29b5bdccea4ea859c24c27ca
  invocation:
    mechanism: profile_sh_plus_view
    mount_pattern: <répertoire de travail dédié>:/work

# Correspondance déclarée entre version de code et révisions des dépôts.
# Ces correspondances sont établies par vérification, pas par similarité de
# numérotation.
versions:
  - name: "17.4.0"
    src_ref: "17.4.0"
    doc_ref: "17.4.0"
    doc_revision: 9c8c179f57ef7ca1d2891cac275ee4823a57967c
    verified_by: "git ls-remote --tags (lot 3, aster-expert sources sync)"
    verified_at: "2026-09-16T00:00:00+00:00"
    note: >-
      codeaster-doc n'a pas de version documentée séparément du code : le
      dépôt gitlab.com/codeaster/doc/docaster tague ses sorties avec les
      mêmes noms de version que gitlab.com/codeaster/src (17.0, 17.2.0,
      17.3.0, 17.4.0, 18.1.0 constatés par ls-remote), sans qu'aucune
      similarité de numérotation n'ait été supposée : c'est la même
      organisation GitLab qui publie un tag identique dans les deux dépôts
      pour la même sortie. Pas de changelog croisé consulté pour confirmer
      au-delà de cette convention de nommage commune ; à réviser sur preuve
      contraire.
#  - name: "18"
#    src_ref: null
#    doc_ref: null
#    doc_revision: null
#    verified_by: null
#    verified_at: null
#    note: null

policy:
  # Renvoyer un fragment d'une autre version que celle demandée.
  cross_version_results: warn   # forbid | warn
  # Comportement si `target` est nul et qu'aucune version n'est passée.
  missing_target: fail          # fail | warn
