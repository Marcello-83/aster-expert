# Validation statique et exécution.

schema_version: 1

static:
  # Contrôles de niveau B, confrontation au catalogue.
  checks:
    unknown_command: error
    unknown_keyword: error
    missing_required_keyword: error
    keyword_cardinality: error
    value_type: error
    value_not_in_enum: error
    unsatisfied_block_condition: error
    concept_used_before_definition: error
    concept_redefined: warning
    unused_concept: warning
    missing_fin: error
    truncation_marker: error       # présence de "..." ou d'un marqueur de coupe
  # Une commande non confrontable au catalogue est toujours reportée.
  report_unchecked_commands: true
  # Suggestion de nom proche, présentée comme suggestion uniquement.
  suggest_close_names: true
  max_edit_distance: 2

execution:
  enabled: true
  # Répertoires (relatifs à la racine du projet, ou absolus) depuis lesquels
  # un fichier peut être exécuté. Vide -> aucune racine autorisée : refus
  # explicite pour tout fichier, jamais un repli permissif (lot 11, O2).
  # `external/codeaster-src/astest` est le corpus des cas tests officiels
  # (lot 3), seule racine vérifiée par ce lot (compte rendu de clôture,
  # lot 11) ; toute autre racine (par ex. les fichiers réels d'un projet
  # utilisateur) est à ajouter explicitement ici, jamais devinée.
  allowed_roots:
    - external/codeaster-src/astest
    # Essai synthétique du lot 21 (FORCE_COQUE), entièrement produit par
    # scripts/build_fcoque_essai.py.
    - data/examples/fcoque_essai
    # Essais synthétiques du lot 22 (ELAS_COQUE, pesanteur, ressorts nodaux),
    # entièrement produits par scripts/build_lot22_essais.py.
    - data/examples/lot22_essais
    # Essais synthétiques du lot 23 (post-traitement sous ELAS_COQUE),
    # entièrement produits par scripts/build_lot23_essais.py.
    - data/examples/lot23_essais
    # Cas du lot 24 (D6), entièrement produits par scripts/build_lot24_essais.py.
    - data/examples/lot24_essais
    # Cas du lot 25 (D7), entièrement produits par scripts/build_lot25_essais.py.
    - data/examples/lot25_essais
    # Cas du lot 26 (lecture des MED de qualification par Code_Aster),
    # entièrement produits par scripts/build_lot26_essais.py.
    - data/examples/lot26_essais
    # Lecture du MED du quai par Code_Aster (lot 27), produite par
    # scripts/build_lot27_maillage.py.
    - data/examples/lot27_maillage
    # .comm du quai, produit par `aster-expert generate` (lot 28).
    - data/examples/lot28_quai
    # Reproducteur minimal du diagnostic de pivot nul (lot 29), entièrement
    # produit par scripts/build_lot29_repro.py.
    - data/examples/lot29_repro
    # Quai réduit (lot 30, étape 2) : maillage par mesh run/mesh check,
    # .comm produit par scripts/generate_lot30_quai_reduit.py (le générateur
    # de production, aucune décision modifiée).
    - data/examples/lot30_quai_reduit
    # Candidats de jonction tête de tube / poutre de couronnement (lot 31,
    # étape 2), même maillage que le quai réduit, .comm produits par
    # scripts/generate_lot31_candidat.py (options de diagnostic du
    # générateur, aucune décision modifiée).
    - data/examples/lot31_jonction
    # Règle de construction des conditions aux limites (lot 32, étape 1),
    # même maillage que le quai réduit, .comm produits par
    # scripts/generate_lot32_regle_cl.py (générateur de production, décision
    # 4 inchangée -- révision levée en mémoire seulement pour la génération).
    - data/examples/lot32_cl
    # Isolation des paramètres hérités RESI_RELA/COEF_RIGI_DRZ (lot 33,
    # étape 1), même maillage que le quai réduit, .comm produits par
    # scripts/generate_lot33_solveur.py (générateur de production, décision
    # 4 inchangée -- un seul paramètre au défaut catalogue à la fois).
    - data/examples/lot33_solveur
    # Vérification de la méthode d'extraction de l'effort dans un ressort
    # DIS_T (lot 33, étape 3), cas isolé à réponse analytique connue.
    - data/examples/lot33_equilibre
    - data/examples/lot34_equilibre
    - data/examples/lot35_synthese
    # Lot 41 bis : cas des constats CA-029, CA-034, CA-035, CA-036, rendus
    # rejouables (maillage et .export versionnés à côté de chaque cas par
    # projets/quai_cw_test_01/scripts/versionner_maillages_lot41bis.py).
    - data/examples/lot35_constats
    - data/examples/lot36_butee
    # Lot 37 : modèles de production (`scripts/generate_lot37.py`), sans option de
    # diagnostic ; quai réduit à deux maillages pour le critère C10.
    - data/examples/lot37_efforts
    # Lot 38, étape 4 : essais de ferraillage sur la section réelle de la poutre
    # de couronnement (CALC_FERRAILLAGE), entièrement produits par
    # scripts/build_lot38_essais.py.
    - data/examples/lot38_essais
    # Essais CALC_FERRAILLAGE du lot 39 (D19, limites 1D, FERR_MIN, 2D, poutre
    # sous les combinaisons), produits par scripts/build_lot39_*.py.
    - data/examples/lot39_essais
    - data/examples/lot39_poutre
    # Lot 41 : résultats des projets (`aster-expert projet <nom> ...`) : .comm
    # produits par le générateur du projet et cas CALC_FERRAILLAGE du tronc
    # commun, écrits sous projets/<nom>/resultats/.
    - projets/quai_cw_test_01/resultats
    # Lot 43 : second projet (dalle appuyée).
    - projets/dalle_appuyee_01/resultats
    # Cas versionnés de la dalle (constats et référence de validation, rejeu).
    - projets/dalle_appuyee_01/references/cas
    # Projet estacade_pieux_01 (aster-expert projet creer, lot 44).
    - projets/estacade_pieux_01/resultats
    - projets/estacade_pieux_01/references/cas
  work_dir_root: data/processed/runs
  keep_work_dir: true
  # Ressources d'une exécution (lot 47 quater, DIAG-025) : ordre de priorité
  # ligne de commande > .export (P time_limit, memory_limit, ncpus, mpi_nbcpu) >
  # config/machine.local.yaml (non versionné, propre à la machine) > cette section >
  # valeurs calculées (aster_expert.execution.ressources). `auto` : pas de valeur
  # imposée ici. Les limites de `docker run` en découlent : --cpus = ncpus ×
  # mpi_nbcpu (jamais non bornée, lot 11 O2 ; refusée au-delà des processeurs de la
  # machine), --memory = mpi_nbcpu × (memory_limit + memory_margin_mb).
  timeout_seconds: auto  # défaut de run_aster : 86 400 s
  memory_mb: auto  # memory_share × mémoire disponible / mpi_nbcpu − marge
  ncpus: 1
  mpi_processes: 1
  # Lot 49 (mesures de l'étape 0, docs/essais_lot49.md § 4.1) : au-delà de 4 fils
  # OpenMP, une exécution ralentit (production de l'estacade : 1,34 à 4 fils, 0,71 à
  # 14 fils). Règle : fils = min(useful_threads_max, processeurs ÷ exécutions
  # simultanées), aster_expert.execution.regle_fils.
  useful_threads_max: 4
  # `addmem` de la configuration run_aster de l'image 17.4.0 (share/aster/config.json,
  # relevé au lot 47 quater), ajouté par run_sbatch à la réservation d'un calcul.
  memory_margin_mb: 2800
  memory_share: 0.8
  # Seuil d'alerte avant exécution (ENV-003) : en dessous, `aster-expert run` refuse.
  min_free_disk_gb: 10
  # Ne jamais supprimer un fichier utilisateur ni écrire hors du work_dir.
  write_outside_work_dir: false
  # Valeurs de mots-clés refusées avant toute exécution (lot 49,
  # aster_expert.execution.interdits) : chacune nomme son diagnostic. Une règle se
  # lève en la retirant d'ici, une fois le diagnostic résolu.
  forbidden_keywords:
    - command: CALC_CHAMP
      keyword: PARALLELISME_TEMPS
      values: ["OUI"]
      diagnostic: DIAG-027
      reason: >-
        réactions fausses de 1 à 2 % (même force ajoutée aux cas 2 à 4 d'un résultat de
        MACRO_ELAS_MULT sous MPI, seul signe l'alarme PREPOST_15) et aucun gain mesuré
        (lot 47 quater) ; interdit tant que DIAG-027 n'est pas résolu

mess_analysis:
  # Extraction déléguée aux modules livrés avec l'installation.
  use_run_aster_modules: true
  # Traitements complémentaires propres au projet, à n'activer qu'après avoir
  # documenté ce que les modules ci-dessus ne couvrent pas.
  project_extensions:
    alarms_table: false
    timing_table: false
    convergence_table: false

reporting:
  # Un niveau supérieur à celui réellement atteint ne doit jamais être écrit.
  max_claimable_level_without_execution: B
  require_sources: true

mesh:
  # Chaîne de maillage (lot 26) : scripts Salomé exécutés sans interface
  # (`aster-expert mesh run`) et vérificateur de MED (`aster-expert mesh check`).
  # Rien de ceci n'est codé en dur dans le code Python.
  work_dir_root: data/processed/mesh_runs
  salome:
    # Image Singularity de Salomé-Méca. `~` est développé au lancement.
    runtime: singularity
    image_path: ~/Desktop/salome_meca.sif
    # Version lue dans le fichier `version_file` de l'installation, dans
    # l'image ; un écart avec `expected_version` arrête l'exécution.
    expected_version: V2024.1.0_scibian_univ
    install_root: /opt/salome_meca/V2024.1.0_scibian_univ
    version_file: README
    version_pattern: 'Version\s*:\s*(\S+)'
    # Scripts d'environnement chargés (relatifs à `install_root`) avant la
    # commande ; établis au lot 25 (docs/inventaire_lot25.md, §3.1).
    env_scripts:
      - salome_prerequisites.sh
      - salome_modules.sh
    # Options de `singularity exec` : conteneur isolé, réseau coupé,
    # `$HOME` non monté.
    container_options: [--containall, --cleanenv, --no-home, --net, --network, none]
    # Commande d'exécution sans interface ; `{script}` et `{args}` sont
    # remplacés (le script reçoit `sys.argv[1:]` = les arguments séparés par
    # des virgules).
    command: "salome -t --shutdown-servers=1 {script} args:{args}"
    # 900 s ne suffisait pas au maillage du quai (lot 27).
    timeout_seconds: 3000
  checker:
    work_dir_root: data/processed/mesh_checks
    # Le vérificateur lit le MED dans le conteneur Docker de `cave` (image
    # résolue par digest comme pour `aster-expert run`), avec `medcoupling`
    # de l'image : jamais Salomé, jamais un module installé dans le projet.
    timeout_seconds: 300
    memory_mb: 2048
    cpus_limit: "1"

environnement:
  # Lot 41 bis : vérifié par `aster-expert env-check` (monté et accessible en
  # écriture). Dossier d'échange avec l'hôte Windows (partage VirtualBox).
  partage: /media/sf_partage/echanges
