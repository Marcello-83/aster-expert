# Niveaux A à E : CLAUDE.md, « Niveaux de validation ». Un niveau n'est donné que pour ce
# que la preuve établit ; `limites` dit ce qui n'est pas couvert.
capacites:
  - nom: recherche
    niveau: A
    etat: operationnelle
    fichiers: [src/aster_expert/retrieval, data/evaluations/questions.jsonl, docs/corpus.md]
    commandes: ["aster-expert search", "pytest tests/unit/test_retrieval_models.py"]
    limites: "Moteur lexical BM25 seul ; ni index vectoriel ni reranking (lots conditionnels C1, C2 non lancés). Corpus, index et catalogue absents d'un runner neuf (ils se reconstruisent, scripts/cloud_setup.sh)."
  - nom: catalogue
    niveau: A
    etat: operationnelle
    fichiers: [src/aster_expert/catalogue, tests/unit/test_catalogue_extract.py]
    commandes: ["aster-expert catalogue extract", "aster-expert catalogue show"]
    limites: "Un seul catalogue : Code_Aster 17.4.0, image par digest (config/versions.yaml)."
  - nom: analyse
    niveau: A
    etat: operationnelle
    fichiers: [src/aster_expert/parsing, tests/unit/test_comm_parser.py]
    commandes: ["aster-expert comm parse", "outil MCP analyze_comm"]
    limites: "Les constructions dynamiques sont déclarées, jamais devinées."
  - nom: validation_b
    niveau: B
    etat: operationnelle
    fichiers: [src/aster_expert/validation, tests/unit/test_validate.py]
    commandes: ["aster-expert validate", "outil MCP validate_comm"]
    limites: "Syntaxe confrontée au catalogue ; ne dit rien de l'exécution ni de la physique."
  - nom: execution_c
    niveau: C
    etat: operationnelle
    fichiers: [src/aster_expert/execution, tests/integration/test_reel_lent.py, config/validation.yaml]
    commandes: ["aster-expert run", "pytest -m lent_aster"]
    limites: "Racines d'exécution déclarées une à une (execution.allowed_roots). Salomé : VM seulement. Depuis le lot 47 quater, délai, mémoire, ncpus et mpi_nbcpu viennent de la ligne de commande, puis de l'.export (répercutés sur docker run), puis de la configuration (config/machine.local.yaml, config/validation.yaml) et de défauts calculés (aster_expert.execution.ressources) ; MPI exécutable (statut lu sur chaque rang, ENV-004) mais sans gain mesuré sur l'estacade ; refus sous 10 Go de disque libre (ENV-003). Lot 49 : fils = min(4, processeurs ÷ exécutions simultanées) sur 3 répétitions par point (gain 1,34 à 4 fils sur la production, perte au-delà) ; PARALLELISME_TEMPS='OUI' refusé avant exécution (DIAG-027)."
  - nom: controles_d
    niveau: D
    etat: operationnelle
    fichiers: [src/aster_expert/controles, projets/dalle_appuyee_01/resultats/paquet/controles]
    commandes: ["aster-expert projet <nom> controles"]
    limites: "Harnais par défaut depuis le lot 46 (CTL-005, CTL-006, CTL-012, CTL-013) ; version 2 de CTL-005 et CTL-013 (lot 47 bis) : échelle déclarée d'un cas autoéquilibré (self_equilibrated_scale). Paquets du quai et de la dalle réexportés avec le harnais au lot 49, sans exécution."
  - nom: reference_e
    niveau: E
    etat: partielle
    fichiers: [projets/dalle_appuyee_01/references, connaissances/references_validation]
    commandes: ["aster-expert connaissances rejouer-references"]
    limites: "Niveau E sur la seule dalle (solution de Navier) ; aucune référence pour le quai."
  - nom: ferraillage
    niveau: D
    etat: operationnelle
    fichiers: [src/aster_expert/rebar, src/aster_expert/ferraillage, tests/unit/test_rebar_ultimate.py]
    commandes: ["aster-expert projet <nom> ferraillage"]
    limites: "Module EN 1992 indépendant calibré sur ssll13b/ssll13d ; FERR_MIN_FISS refusé pour les poutres ; tableau 7.2N transcrit, à vérifier par MM."
  - nom: notes
    niveau: D
    etat: operationnelle
    fichiers: [src/aster_expert/notes, tests/unit/test_notes.py, projets/dalle_appuyee_01/livrables/notes]
    commandes: ["aster-expert note hypotheses|resultats|controler <projet>"]
    limites: "Contenu tiré de la fiche, des données et du paquet de résultats, jamais écrit à la main."
  - nom: maillage
    niveau: D
    etat: operationnelle
    fichiers: [src/aster_expert/meshing, scripts/salome]
    commandes: ["aster-expert mesh run", "aster-expert mesh check", "pytest -m lent_salome"]
    limites: "Salomé n'existe que dans la VM ; indisponible dans le Cloud."
  - nom: base_de_connaissances
    niveau: null
    etat: operationnelle
    fichiers: [connaissances/LISEZMOI.md, src/aster_expert/connaissances, connaissances/metriques/tableau_de_bord.md]
    commandes: ["aster-expert connaissances verifier", "aster-expert rex <projet>"]
    limites: "Depuis le lot 46 une exécution de projet déclare ses connaissances ; aucune exécution passée n'est attribuée ; manifestes d'archive à enregistrer dans la VM (rex --manifeste)."
  - nom: securite_mcp
    niveau: null
    etat: operationnelle
    fichiers: [src/aster_expert/chemins.py, config/chemins.yaml, tests/unit/test_chemins.py]
    commandes: ["pytest tests/unit/test_chemins.py"]
    limites: "Politique de lecture appliquée aux outils MCP et aux commandes recevant un chemin ; les sorties (écriture) ne sont pas couvertes."
  - nom: integration_continue
    niveau: null
    etat: operationnelle
    fichiers: [.github/workflows/ci.yml, .github/workflows/ci-lent.yml, tests/unit/test_ci_workflows.py]
    commandes: ["pytest tests/unit/test_ci_workflows.py"]
    limites: "ci.yml vert sur la branche du lot 46 (2 min 28 s) ; ci-lent.yml corrigé au lot 46 bis (profil ci), passage réel vert sur la branche claude/blissful-turing-ajkazc (constaté par MM, 2026-10-05)."
  - nom: contre_calcul
    niveau: C
    etat: partielle
    fichiers: [projets/estacade_pieux_01/comparaison.py, connaissances/references_validation/REF-015.yaml, src/aster_expert/connaissances/modeles.py]
    commandes: ["aster-expert projet exporter-resultats <nom>", "aster-expert note resultats <nom>"]
    limites: "Comparaison à un calcul externe non validé (type calcul_externe_non_valide, jamais E ni promu) ; REF-015 observée depuis le lot 48 bis (grandeurs dérivées, non rejouables par l'outil) ; lecture C1 à C13 propre à l'estacade ; écarts des moments de pieux inexpliqués."

  - nom: livrables
    niveau: C
    etat: operationnelle
    fichiers: [src/aster_expert/livrables, scripts/livrables_med.py, tests/unit/test_livrables.py, tests/unit/test_livrables_classeur.py]
    commandes: ["aster-expert projet <nom> livrables", "aster-expert resultats lire <nom>", "pytest tests/unit/test_livrables.py"]
    limites: "MED et VTU produits par une exécution de post-traitement qui recopie le .comm de production et n'est acceptée que si ses tables égalent celles de la production (dalle 82 134, quai 9 931 632, estacade 135 668 valeurs) ; CTL-013 sur le MED des charges ; MED jamais versionnés (estacade 1,16 Go). Lecture directe du MED par un ParaView Windows non vérifiée (greffon MEDReader des binaires 5.12+, source secondaire) : VTU fournis. Les scripts ParaView supposent ParaView ≥ 5.10 (noms de tableaux entre guillemets). Le contrôle des charges ne détecte pas un déplacement qui conserve l'aire chargée (point d'application rapporté)."
  - nom: synthese_ingenieur
    niveau: C
    etat: operationnelle
    fichiers: [src/aster_expert/livrables/ingenieur.py, src/aster_expert/livrables/torseurs.py, src/aster_expert/livrables/flexion.py, tests/unit/test_synthese_ingenieur.py]
    commandes: ["aster-expert projet <nom> livrables --sous-etape ingenieur", "pytest tests/unit/test_synthese_ingenieur.py"]
    limites: "Lecture des livrables du lot 49, sans calcul Code_Aster : torseurs concomitants par superposition des cas et des positions mobiles, chaque valeur relue par resultats lire (écart ≤ 1e-9) ; équilibre par état limite. Sections et critères déclarés par projet (engineering_summary). Lot 49 ter : section en T (tee_section, preuve par l'équilibre d'une coupe), bande ±b/2 des coques (exclusion_band), coupe interpolée à une cote, zones disjointes et signe déclaré, moment sur appui E27 avec modèles dérivés du tronc commun (derived_models, livrables --modele, harnais D) et variantes à seuil, convention ingénieur et formats du classeur, livraison avec empreintes (projet <nom> livraison). Modèle auxiliaire A1 de l'estacade hors du critère analytique de 2 % (−8,1 %, expliqué) ; A3 donne un moment d'encastrement nul (charges verticales seules). Quai : efforts de la poutre de couronnement nuls sous G, EAU_P et Q1 (réserve déclarée, à confirmer par MM)."
projets:
  - nom: quai_cw_test_01
    ouvrage: "Quai combi-wall QUAI-CW-TEST-01"
    niveau_atteint: D
    preuve: projets/quai_cw_test_01/resultats/paquet/paquet.json
    limites: "Aucune référence de niveau E ; Es = 210 GPa des armatures en attente d'application (PRE-032, déclarée en révision)."
  - nom: dalle_appuyee_01
    ouvrage: "Dalle appuyée C30/37 6 x 4 x 0,30 m"
    niveau_atteint: E
    preuve: projets/dalle_appuyee_01/resultats/paquet/paquet.json
    limites: "Niveau E acquis par la règle de conservation (E0, E1, E2 rejoués au lot 45)."
  - nom: estacade_pieux_01
    ouvrage: "Estacade sur pieux ESTACADE-PIEUX-01 (contre-calcul d'un modèle non validé)"
    niveau_atteint: D
    preuve: projets/estacade_pieux_01/resultats/paquet/paquet.json
    limites: "Niveau D par le harnais v2 (lot 47 bis), critère écrit après l'exécution (antériorité non démontrable, signalée par le paquet) ; contre-calcul d'un modèle non validé, jamais E : lecture v2 (E17), 17 lignes sur 30 dans la tolérance (v1 : 11), docs/essais_lot47bis.md § 7. Lot 47 ter : hypothèse « DST et chevêtre de 0,80 m » partielle (8/13 lignes contre 6/13) ; des 13 écarts v2, 4 attribués au chevêtre, à la formulation de la dalle et à la grandeur comparée, 7 au maillage (non comparables), 2 inexpliqués (C3 ELS c, C5), aucun à une erreur du modèle (docs/essais_lot47ter.md § 6). Lot 47 quater (clôture) : les écarts de transcription H1 (bouchon mixte) et H2 (tablier à +1,50) n'expliquent pas C3 et C5 (H2 sans effet, H1 les porte de −3/−6 % à +10/+14 %) ; statut final : contre-calcul au niveau D, chaque écart attribué, deux lignes inexpliquées (docs/essais_lot47quater.md § 6.1)."

  - nom: pontons_alu_01
    ouvrage: "Ponton en aluminium PONTONS-ALU-01, palée type sur appuis à axe et trois travées (calcul PRO)"
    niveau_atteint: D
    preuve: projets/pontons_alu_01/resultats/paquet/paquet.json
    limites: "Niveau D (lot 50 bis, P24 à P28) : harnais par défaut et moment à mi-portée sous Q, b = 2,00 m (1,55 %), critère commité avant l'exécution ; taux élastique simplifié (indicateur, pas l'EC9) et balayage de l'inertie livrés en CSV. Lot 50 : poids propre (3,9e-7) et moment sous Q (1,5 %). Données absentes signalées : Avy du MP1200 (AY = AZ), nuance d'acier du chevêtre, poids des défenses ; chevêtre à ±1,05 et choix B / B′ à confirmer par MM. Images ParaView des résultats non produites (manifeste de 10 Mo sur une ligne, 3 402 combinaisons ; images des charges produites au lot 50 quater) ; synthèse générique du jeu B, jeu A par CSV du projet ; vérifications EC9 hors lot. Lot 50 ter : export CSV des cas élémentaires, des combinaisons B et B′, de la géométrie (membres et raccords), des charges et des sections pour l'EC9 du superviseur (docs/essais_lot50ter.md). Lot 51 : palée complète et trois travées, douze variantes ; niveau D (harnais par défaut, 68 cas, 11 variantes ; critère commité avant l'exécution) ; variante A instable (DIAG-030) ; paquet versionné encore celui du lot 50 bis ; vérifications EC9, béton armé et appareils d'appui hors lot (docs/essais_lot51.md). Lot 51 bis : appuis à axe, cinq palées types ; niveau C pour les cinq, D pour 67 cas sur 69 (TP et TM : contrôle non concluant, aucun effort) ; critère commité avant l'exécution ; palée soulevée à l'ELU fondamental (lest manquant 47,5 à 87,6 kN) ; vérifications hors lot (docs/essais_lot51bis.md). Lot 51 ter : ponton intégral, quatre variantes ; niveau D (harnais 221/221 par variante, contrôles 3 à 10 ; critère commité avant l'exécution) ; toutes les palées se soulèvent sous la houle (ancrage requis 131 à 235 kN à l'ELU, 45 à 125 kN à l'ELS caractéristique) ; flèche caractéristique sous HU de L/78 à L/90 ; vérifications hors lot (docs/essais_lot51ter.md). Lot 51 quater : recombinaison sans réexécution (P60, P61), niveau D conservé ; identité exacte avec le lot 51 ter sous P56 ; ancrage requis 0 à 23,4 kN à l'ELU, nul à l'ELS caractéristique (HU_S5 : jusqu'à 56,5 kN) ; flèche caractéristique L/142 à L/164 (impact) ; MED combinés et vues 3D pour B10 et B12 (docs/essais_lot51quater.md). Lot 52 : géométrie PRO (P62 à P66), trois variantes recalculées, niveau D (harnais 221/221, critère commité avant l'exécution) ; aucun recouvrement aux nœuds, zone de soudure 180 mm ; flèches +1,5 à +5,4 % par rapport à B12, flexion nouvelle des tronçons de montant (Mz 11,5 kN·m) ; ancrage requis 0 à 23,3 kN à l'ELU, nul à l'ELS caractéristique ; MED de B52 avec support commun ELNO ; liaisons rigides, souplesse des parois soudées non représentée (docs/essais_lot52.md). Lot 53 : déplacements sous accostage et amarrage par relecture des tables de B52 (niveau D conservé, aucune exécution) ; DY max 79,1 mm (ELU accidentel) et 56,0 mm (ELS caractéristique) au bout du porte-à-faux, DX de l'axe de P5 31,8 mm hors thermique ; tête de P5 sous ACN unitaire à 0,4 % d'une estimation à la main ; aucune limite de déplacement vérifiée (docs/essais_lot53.md)."

