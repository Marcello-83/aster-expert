# État du projet AsterExpert, lisible par la machine (lot 46, étape 3).
#
# Source unique de l'état : la section « État du projet » du README en est GÉNÉRÉE
# (`aster-expert etat readme`) et un test échoue si les deux divergent. Tout lot met
# ce fichier à jour (CLAUDE.md). Chaque entrée de `lots` vient de l'historique Git
# (`git log`) et de `docs/lots/` ou du compte rendu du commit ; aucune de mémoire.
#
# Convention de fusion : MM fusionne par avance rapide (aucun commit de fusion
# dans l'historique, `git log --merges` est vide). `commit` est donc le commit qui
# porte le compte rendu du lot, contenu dans `main` ; `commits_suivants` liste les
# corrections du même lot venues après lui. L'historique publié commence au lot 8
# (racine 82b9a5d) : les lots antérieurs n'ont pas de commit consultable.

