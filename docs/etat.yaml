# (`aster-expert etat readme`) et un test échoue si les deux divergent. Tout lot met
# ce fichier à jour (CLAUDE.md). Chaque entrée de `lots` vient de l'historique Git
# (`git log`) et de `docs/lots/` ou du compte rendu du commit ; aucune de mémoire.
