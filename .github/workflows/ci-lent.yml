# Tests réels Code_Aster (lot 46, étape 2) : `pytest -m lent_aster`, à la demande.
#
# Déclenché à la main seulement (Actions > ci-lent > Run workflow) pour ne pas
# consommer les minutes d'un dépôt privé à chaque envoi. L'image est tirée par son
# digest, lu de config/versions.yaml (jamais par un tag seul, CLAUDE.md principe 1) ;
# ASTER_IMAGE_REF en est dérivé (lot 46 bis), env-check (profil ci) est bloquant.
# Salomé (`lent_salome`) n'existe que dans la VM : jamais ici.

name: ci-lent

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lent-aster:
    # Label fixé (lot 47) : `ubuntu-latest` passe à Ubuntu 26 le 19 octobre 2026 ;
    # `ubuntu-26.04` est en disponibilité générale (actions/runner-images, README,
    # relevé le 2026-10-05) et aligne l'intégration continue sur la VM.
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    env:
      ASTER_CONTAINER_WORKROOT: ${{ github.workspace }}/data/processed/workroot
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.21"
          enable-cache: true

      - name: Dépendances verrouillées
        run: uv sync --locked --all-extras

      - name: Image Code_Aster, tirée par digest
        run: |
          set -eu
          # Source unique de vérité : config/versions.yaml (image et digest).
          # Rien n'est recopié en dur ici (le même digest vit dans
          # scripts/cloud_setup.sh, gardé identique par un test).
          read -r repository tag digest < <(.venv/bin/python - <<'PY'
          import yaml
          data = yaml.safe_load(open("config/versions.yaml", encoding="utf-8"))
          c = data["detected"]["container"]
          print(c["image_repository"], c["image_tag"], c["image_digest"])
          PY
          )
          echo "image : $repository@$digest (étiquette locale $tag)"
          docker pull "$repository@$digest"
          # Étiquette locale du même digest (comme `cave` dans la VM, comme
          # scripts/cloud_setup.sh) ; jamais `stable`.
          docker tag "$repository@$digest" "$repository:$tag"
          mkdir -p "$ASTER_CONTAINER_WORKROOT"
          # Référence de l'image pour env-check, l'extraction du catalogue et les
          # tests (sans `cave`, aucune autre source) : un digest nu, comme dans le
          # Cloud (`ASTER_IMAGE_REF=$IMAGE_DIGEST`).
          echo "ASTER_IMAGE_REF=$digest" >> "$GITHUB_ENV"

      - name: Environnement (profil ci, bloquant)
        run: .venv/bin/aster-expert env-check

      - name: Catalogue de l'image
        run: |
          .venv/bin/aster-expert catalogue extract
          # `catalogue extract` réécrit la section `detected` de config/versions.yaml.
          git checkout -- config/versions.yaml

      - name: Tests réels Code_Aster
        run: .venv/bin/pytest -m lent_aster
