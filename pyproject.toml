[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aster-expert"
version = "0.1.0"
description = "Agent expert Code_Aster : corpus versionné, catalogue, validation et exécution"
readme = "README.md"
# Lot 41 bis : 3.12 fixé par `.python-version`, installé par `uv` dans l'espace
# utilisateur, jamais pris au système. Lot 46 : borne haute alignée sur cette décision
# (`uv.lock` résout pour une seule branche de Python) ; passer à 3.14, évalué au lot
# 41 bis, reste un lot à part, délibéré et testé.
requires-python = ">=3.12,<3.13"
# Licence à choisir avant toute diffusion : décommenter après avoir ajouté
# le fichier LICENSE correspondant.
# license = { file = "LICENSE" }
authors = [{ name = "Marcello Marseguerra" }]
keywords = ["code_aster", "finite-element", "documentation", "validation"]

# Dépendances du Python du projet uniquement.
# Ce paquet n'importe jamais `code_aster` : l'accès au catalogue et à
# l'exécution passe par des sous-processus lancés avec le Python d'Aster
# (voir docs/architecture.md, ADR-002).
dependencies = [
    "typer>=0.12",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "rich>=13.7",
    # Lot 6 : parseur reStructuredText de référence, utilisé pour inventorier
    # et sonder le corpus `codeaster-doc` à partir de ses sources .rst (pas
    # d'un rendu Sphinx construit — voir docs/corpus.md §2 et le compte rendu
    # du lot 6). Ne dépend pas de Sphinx : aucune extension, aucun conf.py
    # exécuté.
    "docutils>=0.21",
    "python-docx>=1.2.0",
    # Lot 49 : classeur Excel récapitulatif des livrables (police Arial 10, en-têtes sur
    # fond gris, format d'affichage arrondi par cellule, valeur exacte conservée) ;
    # bibliothèque de référence pour écrire et relire le format .xlsx, sans Excel.
    "openpyxl>=3.1",
]

[project.optional-dependencies]
# Activé au lot d'indexation. Le choix du moteur lexical est confirmé à ce
# moment, pas avant.
index = [
    "bm25s>=0.2",
    "numpy>=1.26",
]
# Activé au lot du serveur MCP (lot 8). Épinglé à la branche majeure
# effectivement vérifiée sur cette machine (2.2.0) : le SDK a renommé
# FastMCP en MCPServer entre la 1.x et la 2.x (API incompatible -- constaté
# en session, `mcp.server.fastmcp` lève `ModuleNotFoundError` sous 2.x avec
# un message de migration explicite), donc `mcp>=1.2` seul laisserait
# glisser silencieusement vers une API que ce projet n'utilise pas.
mcp = [
    "mcp>=2.0,<3",
]
# Lot 36 : figures de `aster-expert report`. ParaVis hors interface est impossible
# ici (ni Xvfb ni EGL/OSMesa, le ParaView de Salomé-Méca n'a qu'un rendu X) :
# `matplotlib` rend les vues 2D en PNG sans interface (backend Agg). Installation
# autorisée par MM. `numpy` vient avec lui et sert aux tableaux de valeurs des vues.
figures = [
    "matplotlib>=3.8",
    "numpy>=1.26",
]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "types-PyYAML",
]

[project.scripts]
aster-expert = "aster_expert.cli:app"
aster-expert-mcp = "aster_expert.mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/aster_expert"]

[tool.uv]
# Lot 41 bis : le projet ne dépend jamais du Python du système (Ubuntu 26 a
# retiré 3.12 et cassé le `.venv`). `uv` n'emploie que ses propres interpréteurs.
python-preference = "only-managed"

[tool.ruff]
line-length = 88
target-version = "py312"
src = ["src", "tests", "projets"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "PTH", "RET", "SIM", "ARG"]
ignore = []

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ARG"]
# Fixtures are verbatim excerpts of official .comm test cases (see the module
# docstring): their line breaks are not ours to move.
"tests/unit/test_comm_parser.py" = ["ARG", "E501"]
# Le listing de synthèse reprend des lignes de tables réelles du .mess (lot 35).
"tests/unit/test_report_tables.py" = ["E501"]
# Les scripts destinés au Python de l'installation Code_Aster ne doivent
# dépendre que de la bibliothèque standard et peuvent cibler un interpréteur
# plus ancien.
"scripts/*" = ["UP"]
# Lot 51 quater : scripts exécutés par le Python de ParaView (pvbatch, ParaVis), à lire
# et modifier à la main comme le modèle charges_salome du tronc commun (import étoilé
# de paraview.simple, os.path) ; exclus de mypy.
"projets/*/scripts/paraview/*" = ["F403", "F405", "PTH", "SIM105", "C416", "E501", "UP"]
# Lot 46 : les contrôles du harnais par défaut partagent une signature commune
# (ctx, result, summary) et n'en lisent chacun qu'une partie.
"src/aster_expert/controles/harnais.py" = ["ARG001"]
# Lot 45 : le contrôle des notes formule chaque écart en une phrase complète.
"src/aster_expert/notes/controle.py" = ["E501"]
# Lot 41 : les scripts d'un projet ajoutent `projets/` au chemin d'import avant
# d'importer le paquet du projet (E402), comme les scripts ajoutaient `src/`.
"projets/*/scripts/*" = ["UP", "E402", "E501"]
"projets/*/tests/*" = ["ARG"]
# Scripts Salomé d'un projet : Python 3.9 de Salomé-Méca, octets figés par le cache
# de maillage (empreinte du script).
"projets/*/maillage/*.py" = ["UP", "E501"]
# Les gabarits de fichiers .comm générés portent des lignes longues qui sont
# le contenu même du cas versionné, non du code Python.
"scripts/build_lot23_essais.py" = ["UP", "E501"]
"scripts/analyze_lot23_essais.py" = ["UP", "E501"]
"scripts/build_lot24_essais.py" = ["UP", "E501"]
"scripts/analyze_lot24_essais.py" = ["UP", "E501"]
"scripts/build_lot25_essais.py" = ["UP", "E501"]
"scripts/analyze_lot25_essais.py" = ["UP", "E501"]
# Lot 36 : la mise en forme Markdown du rapport de butée porte de la prose et des
# lignes de tableau, dont les coupures ne sont pas du code.
"projets/quai_cw_test_01/scripts/render_lot36_butee_md.py" = ["E501"]
"projets/quai_cw_test_01/scripts/prepare_lot36_livrables.py" = ["E501"]
# Lot 39 : le texte des constats de la fiche est de la prose (une chaîne par champ),
# recopiée telle quelle dans la fiche ; ses coupures ne sont pas du code.
"projets/quai_cw_test_01/scripts/build_lot39_constats.py" = ["E501"]
# Gabarits de .comm (lignes du cas versionné) et mise en forme Markdown de la
# synthèse et de la ligne de comparaison (prose, lignes de tableau).
"scripts/build_lot39_essais.py" = ["UP", "E501"]
"projets/quai_cw_test_01/scripts/build_lot39_poutre.py" = ["UP", "E501"]
"scripts/build_lot39_plaque.py" = ["UP", "E501"]
"projets/quai_cw_test_01/scripts/analyze_lot39_poutre.py" = ["UP", "E501"]
"projets/quai_cw_test_01/scripts/build_lot39_comparaison.py" = ["UP", "E501"]
# Lot 41 : prose des rapports du quai (lignes de tableau, titres de figure), reprise
# telle quelle des scripts des lots 38 et 39.
"projets/quai_cw_test_01/rapports.py" = ["E501"]
# Lot 43 : gabarits de commandes CALC_FERRAILLAGE / CREA_TABLE et lignes de tableau
# Markdown du ferraillage 2D (contenu du .comm et du rapport, non du code).
"src/aster_expert/ferraillage/plaque.py" = ["E501"]
# Lot 43 : gabarit du .comm de la dalle (lignes du fichier généré, non du code).
"projets/dalle_appuyee_01/generation.py" = ["E501"]

[tool.mypy]
python_version = "3.12"
# Lot 41 : les projets (`projets/<nom>/`, paquet importé depuis `projets/`) sont
# vérifiés comme le tronc commun ; leurs scripts de lot portent en tête un réglage
# `# mypy:` relâchant les seules annotations manquantes. Les scripts Salomé
# (Python 3.9 de Salomé-Méca, modules `salome`/`GEOM`/`SMESH` absents de ce
# Python) en sont exclus.
files = ["src", "tests", "projets"]
mypy_path = ["src", "projets", "projets/quai_cw_test_01/scripts", "projets/dalle_appuyee_01/scripts"]
explicit_package_bases = true
# Lot 49 : les sorties des projets (`resultats/`, non versionnées) portent les scripts
# ParaView générés (pvpython, modules `paraview` absents de ce Python).
exclude = ['^projets/[^/]+/maillage/.*\.py$', '^projets/[^/]+/scripts/paraview/.*\.py$', '^projets/[^/]+/resultats/']
strict = true
warn_unreachable = true
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = ["bm25s.*"]
ignore_missing_imports = true

# Lot 41 : scripts génériques d'essais (`scripts/`, hors du périmètre de mypy)
# importés par un script de projet.
[[tool.mypy.overrides]]
module = ["analyze_lot26_essais"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["docutils.*"]
ignore_missing_imports = true

# Lot 35 : tracé optionnel des profils (`aster_expert.report.render.plot_profiles`),
# importé seulement si la bibliothèque est présente ; ce n'est pas une dépendance.
[[tool.mypy.overrides]]
module = ["matplotlib.*"]
ignore_missing_imports = true

# Lot 49 : classeur des livrables ; openpyxl ne livre pas d'annotations (pas de
# dépendance de stubs ajoutée pour cela).
[[tool.mypy.overrides]]
module = ["openpyxl.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests", "projets"]
# Lot 41 : le code propre à un ouvrage vit dans projets/<nom>/, importable comme un
# paquet (`quai_cw_test_01`) depuis le répertoire `projets`.
pythonpath = ["projets"]
# Lot 41 : les tests « lent » lancent réellement Code_Aster et Salomé ; hors de la
# série par défaut. Lot 41 ter : scindés en `lent_aster` (Docker et image
# Code_Aster, possible dans le Cloud) et `lent_salome` (image Salomé, VM seule),
# chacun ignoré avec un motif lisible quand sa ressource manque (tests/conftest.py).
# `pytest -m lent` lance encore les deux.
addopts = "-ra --strict-markers -m 'not lent and not lent_aster and not lent_salome'"
markers = [
    "lent: test réel, Code_Aster ou Salomé (pytest -m lent : les deux familles)",
    "lent_aster: lance réellement Code_Aster dans Docker (pytest -m lent_aster)",
    "lent_salome: lance réellement Salomé, image Singularity (pytest -m lent_salome)",
    "requires_aster: nécessite une installation Code_Aster fonctionnelle",
    "requires_corpus: nécessite les dépôts synchronisés sous external/",
]
